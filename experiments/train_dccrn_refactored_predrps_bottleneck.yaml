# Experiment: DCCRNRefactored with Decoder Bottleneck RPS + PredRPS
# Multi-task learning: audio enhancement + auxiliary RPS prediction
# Uses decoder-side RPS fusion (not encoder-side)

model:
  type: dccrn_refactored
  base_config: configs/13c_DCCRNRefactored_PredRPS_bottleneck.yaml
  overrides:
    training.data_path:
      - "datasets/DREGON-LM/train"
    training.valid_path:
      - "datasets/DREGON-LM/valid"

dataset:
  name: DREGON-LM

run:
  max_duration: 24h
  checkpoint_interval: 1h

wandb:
  tags: [dccrn_refactored, PredRPS, decoder_bottleneck, multi_task]
