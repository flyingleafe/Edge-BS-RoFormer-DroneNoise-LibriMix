# Experiment: DCCRNRefactored with Decoder Hierarchical RPS + PredRPS
# Multi-task learning: audio enhancement + auxiliary RPS prediction
# Uses decoder-side hierarchical RPS fusion (injected at multiple decoder levels)

model:
  type: dccrn_refactored
  base_config: configs/13d_DCCRNRefactored_PredRPS_hierarchical.yaml
  overrides:
    training.data_path:
      - "datasets/DREGON-LM/train"
    training.valid_path:
      - "datasets/DREGON-LM/valid"

dataset:
  name: DREGON-LM

run:
  max_duration: 24h
  checkpoint_interval: 1h

wandb:
  tags: [dccrn_refactored, PredRPS, decoder_hierarchical, multi_task]
