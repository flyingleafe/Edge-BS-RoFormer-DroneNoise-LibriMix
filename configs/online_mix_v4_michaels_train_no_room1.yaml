# Online-mixing RPS training stream matching DREGON-LM-V4-michaels/train sources,
# with validation-leakage guard: free-flight_nosource_room1 is excluded because
# it appears in the V4-michaels validation set.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260617

sources:
  noise:
    - kind: dregon
      root: data
      split: in_flight_noise
      exclude_recording_ids:
        - free-flight_nosource_room1
      min_motor_rps: 30.0
      download: false
    - kind: michaels
      root: data
      ids: [FLY125]
      # Michael's FLY125 motor telemetry hovers around 29 RPS; do not apply the
      # DREGON >30 RPS in-flight threshold to it.
      min_motor_rps: 0.0
  speech:
    - kind: audio_files
      root: data/librispeech/LibriSpeech/train-clean-100
      glob: "**/*.flac"
      cache:
        # Do not preload all LibriSpeech into RAM. A packed/lazy cache can be
        # added behind this same interface; the public source is the original
        # LibriSpeech tree, not generated dataset vocals.
        mode: none

policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward, keep the same mixture distribution and augment 50% of samples;
    # when augmentation is applied, choose exactly one listed augmentation uniformly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
