# Minimal CPU test: DCCRN encoder + RPSPredictionHead, RPS-only training
# Uses DREGON-LM-test dataset (50 train, 10 valid)
audio:
  chunk_size: 32000
  dim_f: 1024
  dim_t: 59
  hop_length: 512
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
  min_mean_abs: 0.000

model: dccrn
use_rps: true
load_rps: true
predict_rps: true
rps_length: 2000
dccrn_gru_hidden: 256
dccrn_gru_layers: 2
num_rotors: 4

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  grad_clip: 0
  data_path:
    - "datasets/DREGON-LM-test/train"
  valid_path:
    - "datasets/DREGON-LM-test/valid"
  instruments:
    - vocals
    - noise
  lr: 1.0e-4
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 2
  num_steps: 5
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: false
  rps_loss_only: true

augmentations:
  enable: false

inference:
  batch_size: 1
  num_overlap: 2
