# Minimal CPU test config for DREGON-LM WITHOUT RPS (baseline DCUNet)
audio:
  chunk_size: 32000  # 2 seconds at 16kHz - optimal for 5-layer DCUNet (no padding needed)
  dim_f: 1024
  dim_t: 59
  hop_length: 512
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
  min_mean_abs: 0.000

model: dcunet
use_rps: false
load_rps: false
dcunet_num_encoder_layers: 5  # Full 5-layer encoder

training:
  batch_size: 2  # Small batch for CPU
  gradient_accumulation_steps: 1
  grad_clip: 0
  data_path:
    - "datasets/DREGON-LM-test/train"
  valid_path:
    - "datasets/DREGON-LM-test/valid"
  instruments:
    - vocals
    - noise
  lr: 1.0e-4
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 2  # Just 2 epochs for testing
  num_steps: 5   # 5 steps per epoch
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: false  # Disable AMP for CPU

augmentations:
  enable: false

inference:
  batch_size: 1
  num_overlap: 2
