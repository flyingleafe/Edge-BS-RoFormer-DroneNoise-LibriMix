# DCUNet baseline (no RPS) on DREGON-LibriMix
# 5-layer encoder, same architecture as RPS version but without rotor conditioning
#
# Baseline for comparison with RPS-conditioned model

audio:
  chunk_size: 131584  # ~8.2 seconds at 16kHz
  dim_f: 1024
  dim_t: 254
  hop_length: 512
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
  min_mean_abs: 0.000

model: dcunet
use_rps: false
load_rps: false
dcunet_num_encoder_layers: 5

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  grad_clip: 0
  data_path:
    - "datasets/DREGON-LM/train"
  valid_path:
    - "datasets/DREGON-LM/valid"
  instruments:
    - vocals
    - noise
  lr: 5.0e-4
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 200
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true
  early_stop:
    enabled: true
    patience: 30
    metric: "si-sdr"

augmentations:
  enable: false  # Keep same as RPS version for fair comparison

inference:
  batch_size: 4
  num_overlap: 4
