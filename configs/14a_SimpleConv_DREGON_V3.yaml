# SimpleConv RPS predictor on DREGON-LM-V3
# Trains SimpleConv to predict 4 rotor speeds per STFT frame from mixture audio
# Uses regular MSE loss (rps_loss_only, no PIT)
audio:
  chunk_size: 16000
  dim_f: 1024
  dim_t: 32
  hop_length: 512
  min_mean_abs: 0.0
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
augmentations:
  enable: false
inference:
  batch_size: 4
  num_overlap: 4
load_rps: true
model: rps_predictor
num_rotors: 4
rps_length: 32
run_name: SimpleConv_DREGON_V3
training:
  batch_size: 8
  coarse_loss_clip: true
  data_path:
  - datasets/DREGON-LM-V3/train
  early_stop:
    enabled: true
    metric: neg_mse
    patience: 30
  ema_momentum: 0.999
  grad_clip: 0
  gradient_accumulation_steps: 1
  instruments:
  - vocals
  - noise
  lr: 0.0005
  num_epochs: 1000
  num_steps: 1000
  optimizer: adamw
  other_fix: false
  patience: 2
  q: 0.95
  reduce_factor: 0.95
  rps_loss_only: true
  target_instrument: vocals
  use_amp: true
  valid_path:
  - datasets/DREGON-LM-V3/valid
