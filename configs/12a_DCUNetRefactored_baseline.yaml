# Refactored DCUNet - Baseline (no RPS)
# Encoder and Decoder are separate modules
# RPS conditioning is decoder-side only (not used in baseline)

audio:
  chunk_size: 131584
  dim_f: 1024
  dim_t: 515
  hop_length: 512
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
  min_mean_abs: 0.000

model: dcunet_refactored
use_rps: false  # No RPS conditioning in baseline
dcunet_num_encoder_layers: 5

training:
  batch_size: 12
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
    - vocals
    - noise
  lr: 5.0e-4
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 200
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true
  early_stop:
    enabled: true
    patience: 5
    metric: "si-sdr"

inference:
  batch_size: 10
  num_overlap: 4
