# RPS-DCUN6-P: DCUNet with rotor speed conditioning, bottleneck projection (6-layer)
# Gulli et al., "Enhancing drone audition with rotor-conditioned deep models" (EURASIP 2025)
audio:
  chunk_size: 131584
  dim_f: 1024
  dim_t: 515
  hop_length: 512
  n_fft: 2048
  num_channels: 1
  sample_rate: 16000
  min_mean_abs: 0.000

model: dcunet
use_rps: true
dcunet_rps_fusion: bottleneck
dcunet_num_encoder_layers: 6
num_rotors: 4

training:
  batch_size: 12
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
    - vocals
    - noise
  lr: 5.0e-4
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 200
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true
  early_stop:
    enabled: true
    patience: 30
    metric: "si-sdr"

inference:
  batch_size: 10
  num_overlap: 4
