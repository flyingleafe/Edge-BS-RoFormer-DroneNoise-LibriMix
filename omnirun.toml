# Per-repo omnirun job defaults (CLI flags override). Committed; backend
# definitions (apocrita-short/-long, colab, kaggle) live in the user-global
# ~/.config/omnirun/config.toml — see docs/data-and-artifacts.md § "Job running".

[job]
outputs = ["results/**"]

[job.resources]
gpus = 1
time = "1h"

[job.env]
# Explicit "uv", not "auto": on notebook backends (colab/kaggle) omnirun
# rewrites auto -> system, and plain pip cannot resolve this project
# (s3fs<->dload-ml botocore conflict needs uv's override-dependencies).
kind = "uv"
