# positional_harmonic_gen — E6 per-drone winner + PER-ROTOR SUB-EMBEDDINGS.
# Copy of positional_harmonic_gen_cond_jitter_latreg_perdrone.yaml with ONE
# change: per_rotor_deltas=true. The emitter conditioning code becomes
#   z_r = z_drone + δz_r
# where δz_r is a learnable per-rotor delta SHARED across drones (rotor identity —
# per-rotor position/manufacturing timbre — is drone-independent). δz is
# zero-initialised, so training STARTS identical to the per-drone-only model (a
# strict generalisation) and each rotor's code then diverges under its own
# position/RPS gradients. Lets the four rotors of a drone differ in timbre
# instead of sharing one code.
#
# CHECKPOINT COMPAT: adds `generator`-sibling `rotor_deltas` [n_rotors, cond_dim]
# on top of the per-drone log_jitter_sigma + spectral-norm keys, so this is a
# NEW-training-only model (strict=False to load a perdrone checkpoint). See
# models.registry._CodebookConditionedNoiseGen.
task: noise_generation
task_params:
  sr: [16000, 1]
  conditioned: true
  return_dict: false
_target_: models.registry.build_noise_gen_model
params:
  model_name: positional_harmonic_gen
  sample_rate: 16000
  n_harmonics: 100
  use_diff_noise: true
  cond_dim: 16
  drone_names: [dregon, michaels]
  rps_jitter_sigma: 0.6
  rps_jitter_tau: 0.016
  learn_rps_jitter_sigma: true
  z_noise_std: 0.1
  film_spectral_norm: true
  per_rotor_deltas: true         # <-- the one new knob vs perdrone
  n_rotors: 4
model_type: null
legacy_config_path: null
