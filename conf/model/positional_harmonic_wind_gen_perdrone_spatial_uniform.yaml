# WIND generator for the SPATIAL likelihood, UNIFORM-EXPOSURE CONTROL.
# Identical module and parameter count to positional_harmonic_wind_gen_perdrone_spatial;
# the only difference is that every microphone receives the ARRAY-MEAN flow speed,
# so the channel keeps its level and RPS dependence but loses the geometry-gated
# variation across microphones — the one thing the wake model claims.
# The codec asks for source_psd / wind_psd / rel_pos separately so the loss can
# model the array covariance; see conf/loss/spatial_likelihood.yaml.
# positional_harmonic_WIND_gen — E6 per-drone winner + additive WIND-WAKE CHANNEL.
# Same as positional_harmonic_gen_cond_jitter_latreg_perdrone.yaml (per-drone
# codebook, learnable per-drone RPS-jitter sigma, spectral-norm FiLM, z-noise
# latent reg) but the model is `positional_harmonic_wind_gen`
# (models.generative.PositionalHarmonicPlusWindGen): the coherent
# harmonic+broadband generator PLUS an additive, spatially-incoherent
# WindWakeChannel summed at each mic. The wind channel is physics-gated (bent
# wake column from rel_pos) with a small learned flow→mic transduction; it is
# drone-SHARED (a microphone property), so `z` still conditions only the coherent
# emitter. Hover regime (V_rel=0) — no quad-dynamics module — matching the
# swapped DREGON+Michael's clips.
#
# CHECKPOINT COMPAT: adds `generator.coherent.*` (was `generator.*`) + a whole
# `generator.wind.*` subtree on top of the per-drone/spectral-norm keys, so this
# is a NEW-training-only model. See models.generative.wind_wake_gen +
# models.registry.build_noise_gen_model.
task: noise_generation
task_params:
  sr: [16000, 1]
  conditioned: true
  return_dict: false
  spatial: true
_target_: models.registry.build_noise_gen_model
params:
  model_name: positional_harmonic_wind_gen   # <-- coherent + wind channel
  sample_rate: 16000
  n_harmonics: 100
  use_diff_noise: true
  cond_dim: 16
  drone_names: [dregon, michaels]
  rps_jitter_sigma: 0.6
  rps_jitter_tau: 0.016
  learn_rps_jitter_sigma: true
  z_noise_std: 0.1
  film_spectral_norm: true
  wind_uniform_exposure: true
model_type: null
legacy_config_path: null
