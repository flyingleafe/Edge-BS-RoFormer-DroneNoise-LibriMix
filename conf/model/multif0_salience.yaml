# multif0_salience (LateDeep CNN over HCQT) — salience_rps task. fmin=32.7
# (C1, 3 harmonics) matches the historical headline checkpoint construction
# (.pi/checkpoints/salience-baselines-dregon-v4-report.md), NOT the model
# class's own code default (fmin=27.5, 4 harmonics) — keep in sync with
# conf/loss/salience_bce_multif0.yaml's `params.fmin`. frame_rate=[16000,256]
# is the HCQT front-end's native time grid (sr=16000, hop_length=256
# defaults) — the salience task's actual output rate, unrelated to
# n_fft/hop_length below (those only feed `predict_rps()`'s STFT-grid
# resample-back step, not exercised by BCE training).
task: salience_rps
task_params:
  n_channels: null
  sr: [16000, 1]
  frame_rate: [16000, 256]
_target_: models.registry.build_model
params:
  name: multif0_salience
  n_fft: 2048
  hop_length: 512
  num_rotors: 4
  fmin: 32.7
model_type: null
legacy_config_path: null
