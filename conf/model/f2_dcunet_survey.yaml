# F2 — DCUNet-10 exactly as in Mukhutdinov et al. 2023 (IEEE Access, "Deep
# Learning Models for Single-Channel Speech Enhancement on Drones").
# Copy of conf/model/a1_baseline_dcunet.yaml with ONLY the paper's audio
# front-end changed:
#   - 8 kHz everywhere (the survey resamples all audio to 8 kHz);
#   - STFT window 64 ms / hop 16 ms -> n_fft 512, hop_length 128 @ 8 kHz,
#     dim_f = n_fft/2 = 256;
#   - T = 24000 samples = 3.0 s crops -> dim_t = 24000/128 + 1 = 188 STFT
#     frames (torch.stft, center=True). NOTE: DCUNet's STFTProcessor reads only
#     n_fft/hop_length/dim_f — dim_t is carried for bookkeeping/other models;
#     the (1, 24000) -> (1, 1, 1, 24000) round trip is length-exact.
# DCUNet-10 = 10 complex conv layers = 5 encoder + 5 decoder layers, i.e. the
# default dcunet_num_encoder_layers (5) of the original config. See
# docs/experiments/f2-survey-replication.md.
task: speech_enhancement
task_params:
  n_channels: null
  use_rps: false
  predict_rps: false
  sr:
  - 8000
  - 1
_target_: models.registry.build_legacy_inline
params:
  model_type: dcunet
  config:
    audio:
      chunk_size: 24000
      dim_f: 256
      dim_t: 188
      hop_length: 128
      n_fft: 512
      num_channels: 1
      sample_rate: 8000
      min_mean_abs: 0.0
    model: dcunet
    training:
      batch_size: 32
      gradient_accumulation_steps: 1
      grad_clip: 0
      instruments:
      - vocals
      - noise
      lr: 0.001
      patience: 5
      reduce_factor: 0.1
      target_instrument: vocals
      num_epochs: 1000
      num_steps: 200
      q: 0.95
      coarse_loss_clip: true
      ema_momentum: 0.999
      optimizer: adam
      other_fix: false
      use_amp: false
      early_stop:
        enabled: true
        patience: 10
        metric: si-sdr
    inference:
      batch_size: 10
      num_overlap: 4
