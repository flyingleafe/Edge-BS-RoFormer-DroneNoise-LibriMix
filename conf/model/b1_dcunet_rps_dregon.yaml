# Native inline Hydra model config (converted from the former
# configs/*.yaml + legacy_config_path indirection). The `config`
# block below is the inlined ZFTurbo-style tree; it is built via
# models.registry.build_legacy_inline -> utils.build_model_from_config,
# the exact same dispatch the file-based path used. See REPLICATION.md.
task: speech_enhancement
task_params:
  n_channels: null
  use_rps: true
  predict_rps: false
  sr:
  - 16000
  - 1
  rps_rate:
  - 16000
  - 512
_target_: models.registry.build_legacy_inline
params:
  model_type: dcunet
  config:
    audio:
      chunk_size: 131584
      dim_f: 1024
      dim_t: 254
      hop_length: 512
      n_fft: 2048
      num_channels: 1
      sample_rate: 16000
      min_mean_abs: 0.0
    run_name: DCUNet+RPS (DREGON)
    model: dcunet
    use_rps: true
    load_rps: true
    rps_length: 8500
    dcunet_rps_fusion: bottleneck
    dcunet_num_encoder_layers: 5
    num_rotors: 4
    training:
      batch_size: 8
      gradient_accumulation_steps: 1
      grad_clip: 0
      data_path:
      - datasets/DREGON-LM/train
      valid_path:
      - datasets/DREGON-LM/valid
      instruments:
      - vocals
      - noise
      lr: 0.0005
      patience: 2
      reduce_factor: 0.95
      target_instrument: vocals
      num_epochs: 1000
      num_steps: 200
      q: 0.95
      coarse_loss_clip: true
      ema_momentum: 0.999
      optimizer: adamw
      other_fix: false
      use_amp: true
      early_stop:
        enabled: true
        patience: 30
        metric: si-sdr
    augmentations:
      enable: false
    inference:
      batch_size: 4
      num_overlap: 4
