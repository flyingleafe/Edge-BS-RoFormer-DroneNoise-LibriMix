# Native inline Hydra model config (converted from the former
# configs/*.yaml + legacy_config_path indirection). The `config`
# block below is the inlined ZFTurbo-style tree; it is built via
# models.registry.build_legacy_inline -> models.registry.LEGACY_MODEL_BUILDERS,
# the exact same dispatch the file-based path used. See REPLICATION.md.
task: speech_enhancement
task_params:
  n_channels: null
  use_rps: true
  predict_rps: true
  sr:
  - 16000
  - 1
  rps_rate:
  - 16000
  - 512
_target_: models.registry.build_legacy_inline
params:
  model_type: dccrn_refactored
  config:
    audio:
      chunk_size: 131584
      dim_f: 1024
      dim_t: 515
      hop_length: 512
      n_fft: 2048
      num_channels: 1
      sample_rate: 16000
      min_mean_abs: 0.0
    model: dccrn_refactored
    use_rps: true
    load_rps: true
    rps_length: 8500
    decoder_rps_fusion: bottleneck
    num_rotors: 4
    predict_rps: true
    rps_norm_scale: 100.0
    training:
      batch_size: 8
      gradient_accumulation_steps: 1
      grad_clip: 0
      instruments:
      - vocals
      - noise
      lr: 0.0005
      patience: 2
      reduce_factor: 0.95
      target_instrument: vocals
      num_epochs: 150
      num_steps: 200
      q: 0.95
      coarse_loss_clip: true
      ema_momentum: 0.999
      optimizer: adamw
      other_fix: false
      use_amp: true
      rps_aux_weight: 0.1
      early_stop:
        enabled: false
    augmentations:
      enable: false
    inference:
      batch_size: 4
      num_overlap: 4
