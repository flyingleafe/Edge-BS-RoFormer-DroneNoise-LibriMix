# DREGON-ONLY noise-generation data with REFINED rotor-speed labels.
#
# Copy of noise_rps_dregon_stream_multimic.yaml with one change:
# `dregon_rps_override_dir`. Every DREGON recording's `motors_measured` values
# are replaced by the refined trajectory in
# `<dir>/<recording id>.npz` (fields `ft`, `r_refined`); the timebase, the
# split, the chunking and the seed stay identical. This is the REFINED-LABEL
# arm of the label A/B — see noise_rps_dregon_stream_multimic.yaml for the
# original-telemetry arm.
#
# The sidecars come from the trajectory-refinement job. A DREGON recording with
# no sidecar makes the loader raise: a silent fall-back to the original
# telemetry would make the two arms the same experiment.
#
# The directory is relative to the repository root, so the same value works on
# every backend.
train:
  _target_: data_processing.frame_datasets.NoiseGenFrameDataset.build_train
  params:
    dregon_dir: frames:DREGON-frames
    michaels_dir: null
    sample_rate: 16000
    chunk_size: 16000
    train_samples: 6000
    val_samples: 256
    val_pct: 0.1
    val_at_start: true
    channel_policy: all
    seed: 42
    dregon_rps_override_dir: src/data_processing/refined_labels
  iterable: false
valid:
  _target_: data_processing.frame_datasets.NoiseGenFrameDataset.build_valid
  params:
    dregon_dir: frames:DREGON-frames
    michaels_dir: null
    sample_rate: 16000
    chunk_size: 16000
    train_samples: 6000
    val_samples: 256
    val_pct: 0.1
    val_at_start: true
    channel_policy: all
    seed: 42
    dregon_rps_override_dir: src/data_processing/refined_labels
  iterable: false
batch_size: null
num_workers: null
