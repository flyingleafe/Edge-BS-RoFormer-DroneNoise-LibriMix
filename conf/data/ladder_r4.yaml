# CURRICULUM RUNG 4 of 4 — gamma_slope_hz [0.05, 0.8].
#
# The rung's own stream for training, validated on HALF REAL and HALF SYNTHETIC
# where the synthetic half is drawn from THIS RUNG's policy. The real half is
# the frozen split, identical at every rung.
#
# The ladder axis is line width — see
# docs/experiments/synthetic-solvability-limits.md. The synthetic validation
# half is drawn at base_seed 990001, away from the training seeds, at 8 s and
# unaugmented so both halves are on one scale.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: conf/online_mix/ladder_r4_dload.yaml
    flatten_channels: true
  iterable: true
valid:
  _target_: data_processing.frame_datasets.MixedRealSynthValidDataset
  params:
    policy_path: conf/online_mix/ladder_r4_dload.yaml
    real_data_dir: "dload:DREGON-LM-V4-michaels-valid-full"
    base_seed: 990001
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    duration_s: 8.0
    augment: false
    flatten_channels: true
  iterable: false
batch_size: null
num_workers: null
