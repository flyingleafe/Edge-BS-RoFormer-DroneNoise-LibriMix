# E4 — RPS training augmented with a live GENERATED noise source (a trained
# PositionalHarmonicNoiseGen rendered by a background producer process; see
# data_processing/generated_noise.py::GeneratedNoisePool and
# configs/online_mix_generated_augment_example.yaml for the full policy,
# read in full there). Same real DREGON (minus room1) + Michael's FLY125 +
# LibriSpeech sources as online_mix_v4_michaels.yaml, plus one `kind:
# generated` noise source (weight 2.0) drawing synthetic-intermittent RPS
# trajectories (data_processing/rps_synthesis.py) that double as the exact
# label. HARD PREREQUISITE: the checkpoint at
# results/noise_gen_dregon_michaels_swapped/best_positional_harmonic_gen.pt
# must exist (E3's swapped-split-only noise-gen run; not a framework
# artifact — sync separately, see REPLICATION.md § E3/E4) and its
# `n_harmonics` must match the policy's `n_harmonics: 100`. Validation stays
# the fixed real split — the generated stream is not seed-reproducible
# (`refresh: true`), never use it for validation/early-stopping.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: configs/online_mix_generated_augment_example.yaml
  iterable: true
valid:
  _target_: data_processing.frame_datasets.DregonLMFrameDataset
  params:
    data_dir: datasets/DREGON-LM-V4-michaels/valid
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
  iterable: false
batch_size: null
num_workers: null
