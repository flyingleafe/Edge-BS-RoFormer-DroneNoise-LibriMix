# M3ABL ablation 3 — the no-curriculum control: ONE single-stage stream that
# pools real recordings (50%) with the generator (25%) and the static comb
# (25%), under the same augmentations as m3cur. Same fixed FULL-envelope real
# validation split as m3cur, so this single run is read against m3cur stage 2 on
# one curve.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: conf/online_mix/m3abl_mixed_dload.yaml
    flatten_channels: true
  iterable: true
valid:
  _target_: data_processing.frame_datasets.DregonLMFrameDataset
  params:
    data_dir: "dload:DREGON-LM-V4-michaels-valid-full"
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    flatten_channels: true
  iterable: false
batch_size: null
num_workers: null
