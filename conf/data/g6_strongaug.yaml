# G6: E12 full-flight stream with the STRONG noise-augmentation family in the
# augmented stage (conf/online_mix/g6_strongaug_dload.yaml — same sources and
# two-stage schedule as E12, family content replaced; see
# docs/experiments/g1-vk-parity.md § Phase G6). Validation identical to E12:
# the fixed FULL-envelope real split (FLY124 — no leakage), so scores compare
# directly to e12_real_fullflight_* / g2_if_transformer.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: conf/online_mix/g6_strongaug_dload.yaml
    flatten_channels: true
  iterable: true
valid:
  _target_: data_processing.frame_datasets.DregonLMFrameDataset
  params:
    data_dir: "dload:DREGON-LM-V4-michaels-valid-full"
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    flatten_channels: true
  iterable: false
batch_size: null
num_workers: null
