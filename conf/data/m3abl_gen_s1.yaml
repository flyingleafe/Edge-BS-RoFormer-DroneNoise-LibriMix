# M3ABL ablation 2 — stage 1 with the M3 per-rotor neural generator as the
# WHOLE noise pool (the analytic static comb is removed). Same fixed
# FULL-envelope real validation split as m3cur, so the two stage-1 curves are
# read side by side.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: conf/online_mix/m3abl_gen_s1_dload.yaml
    flatten_channels: true
  iterable: true
valid:
  _target_: data_processing.frame_datasets.DregonLMFrameDataset
  params:
    data_dir: "dload:DREGON-LM-V4-michaels-valid-full"
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    flatten_channels: true
  iterable: false
batch_size: null
num_workers: null
