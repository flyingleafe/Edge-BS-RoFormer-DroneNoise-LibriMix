# The 8-mic swapped DREGON+Michael's stream with REFINED DREGON labels: same
# split, sources and pins as noise_rps_dregon_michaels_swapped_stream_multimic,
# plus dregon_rps_override_dir — DREGON telemetry values are replaced by the
# L-BFGS-refined sidecar (src/data_processing/refined_labels/). Michael's
# labels are already recalibrated and stay untouched.
train:
  _target_: data_processing.frame_datasets.NoiseGenFrameDataset.build_train
  params:
    dregon_dir: frames:DREGON-frames
    michaels_dir: frames:michaels-frames
    sample_rate: 16000
    chunk_size: 16000
    train_samples: 6000
    val_samples: 256
    val_pct: 0.1
    val_at_start: true
    channel_policy: all
    seed: 42
    dregon_rps_override_dir: src/data_processing/refined_labels
  iterable: false
valid:
  _target_: data_processing.frame_datasets.NoiseGenFrameDataset.build_valid
  params:
    dregon_dir: frames:DREGON-frames
    michaels_dir: frames:michaels-frames
    sample_rate: 16000
    chunk_size: 16000
    train_samples: 6000
    val_samples: 256
    val_pct: 0.1
    val_at_start: true
    channel_policy: all
    seed: 42
    dregon_rps_override_dir: src/data_processing/refined_labels
  iterable: false
batch_size: null
num_workers: null
