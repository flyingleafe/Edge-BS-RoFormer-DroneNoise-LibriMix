# E11 full-flight combined-noise training data WITH augmentation: 50% neural
# generator (full RPS range) + 50% static-comb, both full-flight excitation, +
# LibriSpeech. Validation is the FIXED FULL-envelope real split
# (DREGON-LM-V4-michaels-valid-full: warm-up/takeoff/cruise/landing/ground), since
# these models are trained to handle the whole envelope. The neural-gen source
# needs a GPU producer. Kaggle/P100: override train policy to e10_full_flight_p100.
train:
  _target_: data_processing.frame_datasets.OnlineMixFrameDataset.from_yaml
  params:
    path: conf/online_mix/e11_full_aug_dload.yaml
    flatten_channels: true
  iterable: true
valid:
  _target_: data_processing.frame_datasets.DregonLMFrameDataset
  params:
    data_dir: "dload:DREGON-LM-V4-michaels-valid-full"
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    flatten_channels: true
  iterable: false
batch_size: null
num_workers: null
