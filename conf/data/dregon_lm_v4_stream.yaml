# DREGON-LM-V4 streamed straight from the dload store (no datasets/ checkout
# needed): dload datasets DREGON-LM-V4-train / DREGON-LM-V4-valid, one sample
# per key (fields named by file stem: mixture = wav bytes, rps = npy),
# decoded by data_processing.streams.DloadFrameDataset into Frames
# structurally identical to conf/data/dregon_lm_v4.yaml's
# DregonLMFrameDataset output. Versions resolve via the repo-root dload.lock
# pin (else refs/latest); pass version: <sha-prefix> to override.
#
# Train is an infinite shuffled stream (seeded shard+buffer shuffle,
# repeat: true), so experiments using this config must set
# samples_per_validation (top-level Hydra field) — same contract as the
# online-mix configs. Valid is a finite, ordered pass per validation.
train:
  _target_: data_processing.streams.DloadFrameDataset
  params:
    dataset: DREGON-LM-V4-train
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    channel: 0  # DREGON-LM-V4 mixture.wav is 8-channel; simple_conv_v2 is mono
    shuffle: 1234  # int = fixed shuffle seed; true = fresh seed per run
    repeat: true
  iterable: true
valid:
  _target_: data_processing.streams.DloadFrameDataset
  params:
    dataset: DREGON-LM-V4-valid
    n_fft: 2048
    hop_length: 512
    sample_rate: 16000
    channel: 0  # DREGON-LM-V4 mixture.wav is 8-channel; simple_conv_v2 is mono
    shuffle: false
  iterable: true
batch_size: null
num_workers: null
