# conf/loss/salience_layers_r150.yaml on the HOP-256 time grid. READ THAT FILE:
# it carries the whole argument — why four Gaussian per-rotor layers replace
# one shared triangular map, why `pos_weight` must stay absent, why `focus` is
# 120, and the overfit probe that measures both. Every parameter below is its
# value.
#
# ONE LINE DIFFERS, `rate`. The declared frame rate is not free: `train.py`
# refuses to train when a loss requires a rate the task does not emit
# (`training.validate`, `framespec.check_subsumes`). The three harmonic ports
# emit salience on the STFT grid at hop 512; the two multi-pitch salience
# baselines emit it on their own front end's grid at hop 256 — the HCQT's
# default hop for multif0_salience, and FFT_HOP for basic_pitch_salience, which
# is 256 whatever the sample rate. The hop is an INPUT, and the `_l4` rows
# change no input, thus the rate follows the model rather than the other way
# around. Nothing else moves: the loss interpolates the label onto the model's
# own time axis on every call.
#
# Used by conf/experiment/hb_sal_multif0_l4.yaml and hb_sal_bp_l4.yaml.
terms:
  - name: bce
    _target_: losses.LayerPITSalienceBCELoss
    weight: 1.0
    params:
      out_fmin: 0.0
      out_fmax: 150.0
      out_bins: 300
      n_layers: 4
      sigma_bins: 1.0
      focus: 120.0
      rate: [16000, 256]
