# F1 SE composite loss: negative SI-SDR (metric-aligned, primary) + a
# multi-resolution STFT magnitude term (stable early gradient / spectral
# detail). Replaces masked_mse for the blind SE baselines: MSE at ultra-low SNR
# rewards attenuation-toward-silence (good SDR, flat SI-SDR/eSTOI), so it fails
# to establish a meaningful floor — see docs/experiments/f1-se-blind-baselines.md.
terms:
  - name: si_sdr
    _target_: losses.SISDRLoss
    weight: 1.0
    params:
      n_channels: null
      sr: [16000, 1]
  - name: mrstft
    _target_: losses.MultiScaleSTFTLoss
    weight: 1.0
    params:
      n_channels: null
      sr: [16000, 1]
      pred_key: enhanced
      target_key: target
      n_ffts: [2048, 1024, 512, 256, 128]
      log_weight: 1.0
      loss_type: L1
