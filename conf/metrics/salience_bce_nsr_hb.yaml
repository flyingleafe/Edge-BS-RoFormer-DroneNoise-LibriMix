# Validation-time BCE-on-salience metric on the WIDENED narrow+super-resolution
# output grid — mirrors conf/loss/salience_bce_nsr_hb.yaml exactly, so
# `optim.monitor: bce` tracks the same objective on the validation split.
terms:
  - name: bce
    _target_: metrics.SalienceBCEMetric
    params:
      out_fmin: 20.0
      out_fmax: 130.0
      out_bins: 720
      blur_bins: 2
      pos_weight: auto
      num_rotors: 4
      rate: [16000, 256]
