# Basic speech-separation metric suite (SI-SDR, SDR) at 8 kHz — identical to
# `conf/metrics/separation_basic.yaml` except for the declared Frame rate, for
# the 8 kHz F2 survey-replication arms. Set optim.monitor: si_sdr /
# optim.monitor_mode: max when using this suite (higher is better).
terms:
  - name: si_sdr
    _target_: metrics.SISDRMetric
    params: {n_channels: null, sr: [8000, 1]}
  - name: sdr
    _target_: metrics.SDRMetric
    params: {n_channels: null, sr: [8000, 1]}
