# @package _global_
# C11 step 2 — retrain simple_conv_v2 (8ch source, channel:0 selected) from
# scratch on DREGON + Michael's FLY125, closing the FLY124 cross-drone gap
# (PIT RMSE 7.96 -> 1.63 Hz, R² median 0.52 -> 0.96 vs. the DREGON-only
# checkpoint). In-domain DREGON-LM-V4 regresses slightly (1.62 -> 2.77 Hz),
# attributed to an early-stop artifact (best-by-combined-val at epoch 20),
# not a capacity tradeoff — see REPLICATION.md § C11. Composes identically
# to conf/experiment/c10_arch_sweep_offline.yaml's default (same dataset,
# same default model) but kept as a separately-named experiment for its own
# wandb run / results dir, matching the historical record.
# C11 step 1 (zero-shot cross-drone eval of the DREGON-only checkpoint on
# FLY124, no retraining) is an eval.py-only exercise with no dedicated
# conf/data/fly124_eval.yaml yet — see REPLICATION.md "needs follow-up
# wiring" for what's missing.
defaults:
  - override /data: dregon_lm_v4_michaels
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: c11_dregon_fly125_retrain
epochs: 50
patience: 10
batch_size: 32
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
