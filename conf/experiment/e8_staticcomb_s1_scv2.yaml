# @package _global_
# E8 STAGE 1 (scv2) — RPS predictor trained on the analytic STATIC-COMB noise
# model ONLY (static, RPS-independent amplitudes; >=30% harmonics above floor;
# profiles sampled widely across real-calibrated DREGON<->Michael's ranges),
# validated on the FIXED REAL DREGON+Michael's split. Tests whether FORCING
# harmonic-frequency tracking transfers to real, where the E7 neural-generated
# arm failed (real val PIT MSE ~222, R2 -10.5). Model simple_conv_v2 = the E4/E7 baseline arch.
# No augmentation. Cloud: override train policy to the _dload twin + valid to
# dload. Full batch: docs/experiments/e8-static-comb.md.
defaults:
  - override /data: rps_static_comb_only
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: e8_staticcomb_s1_scv2
epochs: 100
patience: 8
batch_size: 16
num_workers: 6
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
