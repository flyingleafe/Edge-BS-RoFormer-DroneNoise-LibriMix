# @package _global_
# ARM C — hFT-Transformer (ported) on the REAL R4 CURRICULUM: the comb-only
# curriculum, stage 2, on the R2 honest base.
#
# WHAT R4 IS (docs/experiments/unified-baseline-eval.md § "Regime-matched
# reruns"). The regime taxonomy is R1 architecture search, R2 real-only honest,
# R3 gen+comb curriculum, R4 comb-only curriculum, R5 mixed one-stage. Every
# regime cell keeps ONE real component — the R2 honest pool with the warm-up
# stage removed, `conf/online_mix/hb_m3s2_dload.yaml` — and differs only in the
# synthetic ingredient and its schedule. R4's synthetic ingredient is the
# ANALYTIC STATIC COMB, supplied as a warm start from a stage-1 checkpoint
# trained on `conf/online_mix/m3abl_comb_s1_dload.yaml`.
#
# So this row is `r4hb_gru` with the model swapped: same real stream, same
# frozen real validation split (`dload:DREGON-LM-V4-michaels-valid-full`, the
# protocol of docs/experiments/unified-baseline-eval.md), same renewed patience,
# and a warm start from THIS model's own stage 1 — `hft_comb`, which trains on
# the same comb policy `m3abl_comb_unigru128_s1` used.
#
# The reference rows this one is read against: `hb_sal_multif0` (the LateDeep
# salience family on real data) at flight MAE 4.01, and `r3hb_gru`, the best
# regressor, at 2.79.
#
# batch_size 8 with grad_accum_steps 2: the cross-attention map is linear in
# the batch, and 8 frames is one chunk's eight microphone rows, so the
# accumulation is what makes the step a batch of two scenes rather than one.
#
# Data group is `m3cur_s2` for its real validation split; only the training
# stream is overridden, exactly as `r4hb_gru` does it.
#
# ─── THE L4 VARIANT ───────────────────────────────────────────────────────
# This row is its `_l4`-less twin with the OUTPUT REPRESENTATION replaced, and
# nothing else: same stream, same validation draw, same epoch budget, patience,
# batch size, workers and monitor. Three files change together and they must:
#   model   -> conf/model/*_rps_l4.yaml   (n_maps 4: one salience layer per rotor)
#   loss    -> conf/loss/salience_layers_r150.yaml     (Gaussian layers, PIT BCE)
#   metrics -> conf/metrics/salience_layers_r150.yaml  (the same, plus rps_mae)
#
# WHY. `models.salience_crf` encoded real training telemetry into the shared
# salience map and decoded it back — a PERFECT target, no model involved — and
# got the trajectory back 8.24 rev/s away on average, with 39-45% of frames more
# than half a bin off. Gaussian per-rotor layers with the CRF readout return
# 2.22e-16. The old number is an ORACLE FLOOR: no model reading that
# representation could have scored better, so every `_l4`-less row above was
# measuring the representation as much as the architecture. This row removes
# that ceiling and leaves the architecture question intact.
#
# At eval the decode is `models.harmonic_ports.layer_readout.LayerCRFReadout` —
# one CRF best path per layer, NO threshold and NO Hungarian step. A stopped
# rotor is the path sitting at bin 0, which is a value; the old decoder had to
# call it an absence, which is what forced the threshold.
defaults:
  - override /data: m3cur_s2
  - override /model: hft_rps_l4
  - override /loss: salience_layers_r150
  - override /metrics: salience_layers_r150

experiment_name: hft_r4_l4
checkpoint: r2://ml-data/artifacts/hft_comb_l4/checkpoints/best.ckpt
data:
  train:
    params:
      path: conf/online_mix/hb_m3s2_dload.yaml
epochs: 200
patience: 20
batch_size: 8  # frames (= 1 chunk x 8 mics)
grad_accum_steps: 2  # effective batch 16 frames = 2 chunks — sal150_comb's
num_workers: 6
samples_per_validation: 16000
optim:
  monitor: bce
  monitor_mode: min
