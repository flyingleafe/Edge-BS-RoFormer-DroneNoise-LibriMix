# @package _global_
# C8 — basic_pitch_salience (Bittner contour branch) salience-map RPS
# baseline on DREGON-LM-V4, 8-channel-as-extra-batch-item (see
# conf/data/dregon_lm_v4_8ch_flat.yaml and conf/experiment/c7_multif0_salience.yaml
# for the shared rationale). `optim.monitor: bce` tracks BCE-on-salience on
# the validation split. Historical command: train_rps_predictor.py --model
# basic_pitch_salience --data_root datasets/DREGON-LM-V4 --device cuda:0
# --epochs 200 --patience 15.
defaults:
  - override /data: dregon_lm_v4_8ch_flat
  - override /model: basic_pitch_salience
  - override /loss: salience_bce_basic_pitch
  - override /metrics: salience_bce_basic_pitch

experiment_name: c8_basic_pitch_salience
epochs: 200
patience: 15
optim:
  monitor: bce
  monitor_mode: min
