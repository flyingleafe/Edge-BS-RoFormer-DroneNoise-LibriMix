# @package _global_
# Diagnostic arm 1 of hb_ebsrof: identical in every field except lr (1e-4
# instead of 1e-3). Submit this ONLY if hb_ebsrof is flat again — see
# conf/experiment/hb_ebsrof_lowlr.md. Batch doc:
# docs/experiments/unified-baseline-eval.md.
defaults:
  - override /data: e12_real_fullflight
  - override /model: edge_bs_rof_rps
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: hb_ebsrof_lowlr
epochs: 200
patience: 20
batch_size: 64  # frames (same as hb_ebsrof — the only difference is lr)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics)
data:
  train:
    params:
      path: conf/online_mix/hb_silence_dload.yaml
optim:
  lr: 0.0001  # 10x lower than hb_ebsrof — the July debug arm that at least moved the loss
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
