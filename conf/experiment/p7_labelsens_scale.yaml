# @package _global_
# ARM S — constant-bias control. The label is 0.99458 x truth with no
# staircase at all. A constant gain is an invertible reparameterization, so the
# generator should absorb it and match arm A; if it does not, the 0.542 %
# telemetry bias is NOT benign and arm B's result cannot be read as the
# staircase alone.
#
# Every arm is byte-identical except data.{train,valid}.params.label_mode.
# Same seed, same epoch/patience budget, same optimizer — the comparison is
# only meaningful at a shared budget. Batch doc:
# docs/experiments/generator-label-sensitivity.md.
defaults:
  - override /data: static_comb_gen
  - override /model: positional_harmonic_gen
  - override /loss: multiscale_stft
  - override /metrics: noise_gen_spectral

experiment_name: p7_labelsens_scale
seed: 1234
epochs: 40
patience: 8
batch_size: 32
num_workers: 6
grad_clip: 1.0
optim:
  optimizer: adam
  lr: 0.001
  monitor: mrstft
  monitor_mode: max

# fp16 autocast breaks the emitter: freqs_to_phasors uses a complex cumprod and
# "cumprod_cuda" is not implemented for ComplexHalf (E6 finding).
amp: false

data:
  train:
    params:
      label_mode: scale
  valid:
    params:
      label_mode: scale
