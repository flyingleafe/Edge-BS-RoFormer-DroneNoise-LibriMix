# @package _global_
# C10 — 26-variant SimpleConv architecture sweep, ONLINE-MIX arm
# (autoresearch session 20260617-012233, 2026-06-18 rerun). Same 26 model
# keys as conf/experiment/c10_arch_sweep_offline.yaml — override `model`
# per variant. The dedicated winner (simple_conv_v2_uni_gru128, PIT MSE
# 7.33, best overall) has its own named file:
# conf/experiment/c10_uni_gru128_online.yaml (mirrors the worked example in
# docs/refactor-unified-framework.md § "Hydra config architecture").
# Clipped-GRU follow-up (uni_gru* variants only, grad_clip=0.5):
#   python train.py experiment=c10_arch_sweep_online model=simple_conv_v2_uni_gru grad_clip=0.5
# Historical command: train_rps_predictor.py --model <key> --data_root
# datasets/DREGON-LM-V4-michaels --online_mix --mix_config
# configs/online_mix_v4_michaels_train_no_room1_gpfs.yaml
# --samples_per_validation 5000 --epochs 200 --patience 50 --batch_size 32
# --lr 1e-3 --weight_decay 1e-4 --loss pit_mse. Results on HPC scratch (not
# synced) — see REPLICATION.md § C10.
defaults:
  - override /data: online_mix_v4_michaels
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: c10_arch_sweep_online
epochs: 200
patience: 50
batch_size: 32
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
