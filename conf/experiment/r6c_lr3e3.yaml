# @package _global_
# R6C — R6 with the fine-tune learning rate RAISED to 3e-3. ONE line differs
# from `r6hb_scv2`.
#
# THIS ARM IS A DIRECT PREDICTION, not a sweep. The learning-rate ladder found
# a large interaction between the rate and the stage-1 checkpoint:
#
#   init         lr 1e-3    lr 3e-4     (best val PIT-MSE)
#   comb           17.59      15.37     lower rate HELPS
#   stochastic     23.78     180.39     lower rate DESTROYS
#
# The two initializations differ by 1.35x at 1e-3 and by 11.74x at 3e-4. Since
# a lower rate preserves more of the initialization, the reading is that the
# stochastic checkpoint is a WORSE place to start a real fine-tune from,
# despite being the better model on the frozen split — it is strong exactly
# where real data is not needed (cruise) and has nothing to offer where real
# data carries the information (the zero cells).
#
# If preserving the stochastic init is what hurts, then OVERWRITING it harder
# should help, and the ladder should run the other way for this checkpoint.
# 3e-3 is the mirror of the 3e-4 step that helped the comb init.
#
# Falsifiable: if 3e-3 is also worse than 1e-3, the stochastic checkpoint is
# simply a bad initialization at every rate and no schedule rescues it, which
# closes the stage-1-family question for good.
# Batch doc: docs/experiments/stochastic-transfer.md.
defaults:
  - override /data: m3cur_s2
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: r6c_lr3e3
checkpoint: r2://ml-data/artifacts/stoch_s1id_scv2/checkpoints/best.ckpt
data:
  train:
    params:
      path: conf/online_mix/hb_m3s2_dload.yaml
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics)
optim:
  lr: 0.003
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
