# @package _global_
# gen_w4_lik_wind_mm — spectral likelihood, MULTI-OBSERVER (all 8 mics), WITH the wind channel.
#
# the arm the whole exercise is for: likelihood objective AND multiple observers, the two conditions under which the wind channel is both fittable and identifiable.
#
# Two things had to be true before the wind channel could work, and the single-
# microphone arms (gen_w1/gen_w2) hold only the first:
#   1. It must be FITTABLE. Gusts are stochastic, so scoring a synthesized gust
#      against the one the mic caught measures draw-vs-draw difference; the
#      fitted level is biased low by ln2 (-1.6 dB) and the gradient is noise.
#      conf/loss/spectral_likelihood.yaml fixes that by scoring a predicted
#      variance instead of a realization.
#   2. It must be IDENTIFIABLE. The wind is distinguished from the coherent
#      generator's own broadband branch only by its SPATIAL law — a wake-gated,
#      per-mic-incoherent field against a 1/r-propagated one. With M=1 that
#      difference is invisible and the wind is just another broadband shape
#      competing with a more flexible learned 60-band filter. Multi-observer
#      training is what gives it something only it can explain.
#
# Batch 4 x accum 8 = effective 32, matching the single-mic arms' optimizer
# steps; the 8x audio per item is paid for with the smaller batch.
defaults:
  - override /data: noise_rps_dregon_michaels_swapped_stream_multimic
  - override /model: positional_harmonic_wind_gen_perdrone_lik
  - override /loss: spectral_likelihood
  - override /metrics: noise_gen_spectral

experiment_name: gen_w4_lik_wind_mm

epochs: 60
patience: 8
batch_size: 4
grad_accum_steps: 8
grad_clip: 1.0
optim:
  optimizer: adam
  lr: 0.001
  # Monitor the OBJECTIVE, not mrstft. mrstft compares a sampled realization,
  # so it prefers under-dispersed models: a likelihood-trained model correctly
  # widens its predicted variance, mrstft falls, and early stopping both halts
  # training and picks the wrong checkpoint. Observed on the first attempt --
  # gen_w2 early-stopped at epoch 8 with mrstft BELOW the warm-start baseline.
  # mrstft is still logged and still reported by the eval, as a cross-check.
  monitor: val_loss
  monitor_mode: min

amp: false

# WARM START — load the magnitude-trained baseline before switching objective.
# This is required, not cosmetic: from a random init the generator emits
# |audio| ~ 80 against audio of ~0.05, so (r - a)^2 / sigma2 is ~1e12 at step 0
# and the first optimizer step destroys the model (measured; no variance floor
# rescues it, because the mean is the problem). Starting from a sane mean puts
# the ratio in the hundreds. It also sharpens the comparison: every arm then
# begins from the same weights and differs only in objective and observers.
checkpoint: r2://ml-data/artifacts/gen_v1_recal/checkpoints/best.ckpt
