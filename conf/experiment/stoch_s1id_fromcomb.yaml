# @package _global_
# STAGE 1.5 of the three-stage curriculum (R9). Arm ID's stochastic stream,
# warm-started from the COMB stage-1 checkpoint instead of from scratch.
#
# The ONE difference from `stoch_s1id_scv2` is the `checkpoint:` line.
#
# WHY A THIRD STAGE. Three results constrain the answer and they point the
# same way:
#  - R4 (comb stage 1 -> real stage 2) holds the record at 2.67 all-MAE.
#  - R6 (stochastic stage 1 -> real stage 2) reached 3.04, so a BETTER
#    synthetic-only start (7.40 against 8.30) does not survive the fine-tune.
#  - R5 (one stage, synthetic mixed into real) reached 147.6 val/mse against
#    R4's 17.59, and R7 repeats that verdict, so mixing synthetic into a real
#    stream is what actually damages the result.
#
# Staging works and mixing does not. The untried arrangement that respects
# both is to keep every stage PURE and add a stage: comb, then stochastic,
# then real. The model then sees the coverage of both synthetic families
# before the real data, and never sees the two mixed.
#
# This experiment produces the stage-1.5 checkpoint only. R9 is the stage-2
# run that warm-starts from it.
# Batch doc: docs/experiments/stochastic-transfer.md.
defaults:
  - override /data: stoch_s1id
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: stoch_s1id_fromcomb
checkpoint: r2://ml-data/artifacts/m3abl_comb_scv2_s1/checkpoints/best.ckpt
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics)
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
