# @package _global_
# ARM B — harmof0_rps on the STOCHASTIC rotor-noise curriculum, validated on a
# held-out draw of the same family.
#
# conf/experiment/hf0_comb.yaml with the stream swapped from the analytic
# static comb to conf/online_mix/stoch_s1_dload.yaml (a smooth colored floor
# plus one Lorentzian line per harmonic of every rotor, every amplitude
# drifting as a Gaussian process — the widest synthetic family the project
# has). Everything else is arm A verbatim, so the pair isolates the FAMILY.
#
# WHY THE PAIR MATTERS FOR THIS MODEL IN PARTICULAR. The gather reads the
# spectrum at exactly k*r. On the static comb that read lands on a line of zero
# width; on the stochastic family the line has a Lorentzian width that varies
# per window, so the same read lands on a shoulder as often as on a peak. The
# arm measures how much of the gather's advantage survives a line that is not a
# delta — which is the question that decides whether the port is worth taking
# to real recordings at all.
defaults:
  - override /data: sal_stoch_synthval
  - override /model: harmof0_rps
  - override /loss: salience_bce_r150
  - override /metrics: salience_bce_r150

experiment_name: hf0_stoch
epochs: 200
patience: 20
batch_size: 16  # frames (= 2 chunks x 8 mics) — arm A's value, kept
num_workers: 6
samples_per_validation: 16000
optim:
  monitor: bce
  monitor_mode: min
