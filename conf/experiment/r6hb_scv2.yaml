# @package _global_
# R6 — the STOCHASTIC curriculum, stage 2, on the R2 honest regime (the plain
# BiGRU baseline (`simple_conv_v2`)). Warm-started from `stoch_s1id_scv2`'s
# best.ckpt, the stochastic-comb campaign's best synthetic-only model.
#
# The ONE difference from `r4hb_scv2` is the stage-1 checkpoint: the stochastic
# family in place of the analytic static comb (`m3abl_comb_scv2_s1`). The real
# fine-tune stream (`conf/online_mix/hb_m3s2_dload.yaml`), the trunk, the loss,
# the optimizer, the patience and the validation split are all identical, so
# the rows differ only in what the synthetic stage taught.
#
# WHY THIS IS THE ARM. `r4hb_scv2` at 2.67 all-MAE is this project's best
# result on the frozen split, and it is ALREADY a mixed run — comb stage 1 plus
# real stage 2. What the stochastic campaign bought is a better stage 1: on the
# real split, before any real data is seen, `stoch_s1id_scv2` reads 7.40
# all-MAE against `m3abl_comb_unigru128_s1`'s 8.30 and `m3abl_comb_scv2_s1`'s
# worse still, and it wins three of the six rig x regime cells outright. If a
# better initialization survives the fine-tune, this row beats 2.67.
#
# Batch doc: docs/experiments/stochastic-transfer.md.
defaults:
  - override /data: m3cur_s2
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: r6hb_scv2
checkpoint: r2://ml-data/artifacts/stoch_s1id_scv2/checkpoints/best.ckpt
data:
  train:
    params:
      path: conf/online_mix/hb_m3s2_dload.yaml
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics)
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
