# @package _global_
# DCUNet encoder + RPSPredictionHead, RPS-only loss (no speech-enhancement loss term) on DREGON-LM.
defaults:
  - override /data: dregon_lm_v1
  - override /model: b1_dcunet_rpsonly_dregon
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: b1_dcunet_rpsonly_dregon
optim:
  monitor: mse
  monitor_mode: min
