# @package _global_
# R2 honest-base regime (silence arm + SNR reference floor) with the
# Edge-BS-RoFormer RPS trunk. Batch doc:
# docs/experiments/unified-baseline-eval.md. Recipe identical to
# hb_scv2_mag except the model and the batch size; no voicing gate exists on
# this trunk, thus the comparison cell is hb_scv2_mag_nogate.
defaults:
  - override /data: e12_real_fullflight
  - override /model: edge_bs_rof_rps
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: hb_ebsrof
epochs: 200
patience: 20
batch_size: 64  # frames (halved vs the HB standard 128: axial attention over full-length
  # validation clips OOM'd a V100-16GB at 128 — kept from ebsrof_rps_e12)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics)
data:
  train:
    params:
      path: conf/online_mix/hb_silence_dload.yaml
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
