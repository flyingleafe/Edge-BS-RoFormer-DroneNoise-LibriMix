# @package _global_
# F1 MP-SENet (parallel magnitude+phase, generator-only ~1.7M) — Pass A (drone noises only). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_a
  - override /model: f1_mpsenet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_mpsenet_a
amp: false  # complex STFT/iSTFT (ComplexHalf gaps under autocast)
samples_per_validation: 20000
epochs: 100
patience: 20
optim:
  monitor: si_sdr
  monitor_mode: max
