# @package _global_
# F1 MP-SENet (parallel magnitude+phase, generator-only ~1.7M) — Pass A (drone noises only). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_a
  - override /model: f1_mpsenet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_mpsenet_a
# fp32: MP-SENet does not train in half precision. Measured 2026-08-04:
# bf16 learned fast then NaN-poisoned the weights at epoch-0 step ~407; fp16
# + GradScaler stayed FLAT for 5 epochs (val si_sdr −36.7, no updates) — the
# phase path (angle/atan2 around zero magnitudes) emits inf/NaN grads on
# ~every half-precision batch, so the scaler skips every step. The fp32 run
# converges (~epoch 67 in 16 h); resume: true chains segments instead.
amp: false
resume: true  # chainable across wall-limited job segments (last.ckpt)
samples_per_validation: 20000
epochs: 150
patience: 30
optim:
  monitor: si_sdr
  monitor_mode: max
  patience: 15
