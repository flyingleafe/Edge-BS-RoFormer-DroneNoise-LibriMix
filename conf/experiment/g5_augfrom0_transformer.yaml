# @package _global_
# G5 — augmentation-from-sample-0 arm (criterion 2.3; docs/experiments/
# g1-vk-parity.md). The E12 recipe's 50k-sample unaugmented warmup spans
# epochs 1-10 while every arm's best val lands at ep 8-18 — augs barely
# engage before overfit onset. Identical to the E12 recipe (transformer model)
# except the online-mix policy augments + time-warps from sample 0.
defaults:
  - override /data: g5_augfrom0
  - override /model: simple_conv_v2_transformer
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: g5_augfrom0_transformer
epochs: 200
patience: 20
batch_size: 16
num_workers: 6
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
