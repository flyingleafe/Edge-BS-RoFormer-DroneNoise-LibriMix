# @package _global_
# Conditional RPS refiner: phase-only CKLA backbone + corrupted-track
# conditioning (bounded residual output), trained (audio, corrupt(GT)) -> GT
# on the fs_v2 stream WITHOUT the AVQ source (ckla_phaseonly_fs_v2's chain)
# with plain non-PIT MSE (output rotor order == conditioning rotor order).
defaults:
  - override /data: ckla_refiner
  - override /model: simple_conv_v2_ckla_phaseonly_cond
  - override /loss: mse_cond
  - override /metrics: rps

experiment_name: ckla_refiner
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics — legacy-equivalent epoch)
grad_clip: 1.0  # phase_only readout: atan2 near zero phasor -> exploding grads; clip at 1.0
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
