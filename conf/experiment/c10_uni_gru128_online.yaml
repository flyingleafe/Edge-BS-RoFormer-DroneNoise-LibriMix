# @package _global_
# C10 winner — simple_conv_v2_uni_gru128, online-mix arm (PIT MSE 7.33,
# R² 0.82; best result of the whole 26-variant × 2-regime sweep). Notably
# the causal uni-GRU family "fails offline" (NaNs/collapses in
# c10_arch_sweep_offline) but becomes the best online-mix variant — see
# REPLICATION.md § C10. This file mirrors the worked example in
# docs/refactor-unified-framework.md § "Hydra config architecture" (that
# doc's illustrative `data: dregon_lm_v4_michaels_online` is this repo's
# actual `online_mix_v4_michaels` group). Results on HPC scratch (not
# synced) — see REPLICATION.md § C10.
defaults:
  - override /data: online_mix_v4_michaels
  - override /model: simple_conv_v2_uni_gru128
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: c10_uni_gru128_online
epochs: 200
patience: 50
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
