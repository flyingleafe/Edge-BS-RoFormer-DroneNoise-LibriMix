# @package _global_
# Generator retrain variant 1/3 — CORRECTED mic-array geometry, no new
# architecture. This is the last trained generator (the E6 winner:
# positional_harmonic_gen_cond_jitter_latreg_perdrone — per-drone codebook
# [dregon, michaels], learnable per-drone RPS-jitter sigma, spectral-norm FiLM,
# z-noise latent reg) re-run on the swapped DREGON+Michael's split, now with the
# 180°-corrected DREGON + horizontal-ring Michael's geometry (commit 00b86c1),
# streamed from the corrected `frames:` datasets so it runs on any backend.
#
# Purpose: isolate the effect of the geometry fix alone (vs the OLD wrong-geometry
# E6 perdrone run) before adding per-rotor sub-embeddings (v2) or the wind
# channel (v3). Schedule identical to e6_noisegen_jitter_latreg_perdrone.
defaults:
  - override /data: noise_rps_dregon_michaels_swapped_stream
  - override /model: positional_harmonic_gen_cond_jitter_latreg_perdrone
  - override /loss: multiscale_stft
  - override /metrics: noise_gen_spectral

experiment_name: gen_v1_corrected

# batch 16 x grad_accum 2 = effective batch 32 (identical optimizer steps &
# averaged gradient to v2's batch-32) at ~half peak GPU memory, so it fits any
# backend incl. the 14.5 GB Colab T4 — lets omnirun place it unpinned without OOM.
epochs: 60
patience: 8
batch_size: 16
grad_accum_steps: 2
grad_clip: 1.0
optim:
  optimizer: adam
  lr: 0.001
  monitor: mrstft
  monitor_mode: max

# fp16 autocast breaks the emitter (ComplexHalf cumprod unimplemented on CUDA).
amp: false
