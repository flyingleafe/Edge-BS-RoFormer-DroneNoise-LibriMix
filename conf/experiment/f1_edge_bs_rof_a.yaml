# @package _global_
# F1 Edge-BS-RoFormer (band-split transformer, Paper 1 in-house SOTA) — Pass A (drone noises only). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_a
  - override /model: a1_edge_bs_rof_fa
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_edge_bs_rof_a
amp: false  # complex STFT/iSTFT (ComplexHalf gaps under autocast)
samples_per_validation: 5000
epochs: 80
patience: 8
optim:
  monitor: si_sdr
  monitor_mode: max
model:
  params:
    config:
      model:
        flash_attn: false  # framework's pre-run CPU 1-batch validation has no flash SDPA backend
