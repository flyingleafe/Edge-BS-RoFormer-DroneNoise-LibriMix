# @package _global_
# CKLA P1 process-noise arm (docs/experiments/ckla.md § mechanistic levers).
# Exact clone of ckla_p1_if except the model conf: p_init 1.0 (live Kalman
# gain) instead of the KLA-default 0.01 under which the measured head
# degenerates to clip-scale accumulators (activation analysis §A2). Directly
# targets the dregon_cruise loss (2.87 vs floor 2.481): bounded λ restores
# within-clip tracking bandwidth. Watch FLY124 — if the 1.39 win came from
# the accumulator prior, this arm may trade it away (that itself is the
# mechanism confirmation).
defaults:
  - override /data: e12_real_fullflight
  - override /model: simple_conv_v2_ckla_pnoise
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: ckla_p1_pnoise
epochs: 200
patience: 20
batch_size: 16
num_workers: 6
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
