# @package _global_
# E3 — E2 + swapped (corrected) DREGON split + Stage-2 smoothness
# regularisers (random-phase training is automatic — HarmonicNoiseGenNew
# always draws random per-harmonic phases while model.training is True, no
# flag needed). Historical command
# (.pi/checkpoints/noise-gen-swapped-smoothness-random-phase.md):
#   train_noise_generation.py --online_config
#   configs/noise_gen_online_dregon_michaels_swapped.yaml --cond_dim 16
#   --device cuda:0 --epochs 200 --patience 20 --batch_size 32
#   --duration_s 1.0 --n_harmonics 100 --samples_per_epoch 6000
#   --num_valid 256 --num_workers 8 --harm_smooth_weight 1e-2
#   --noise_smooth_weight 1e-2
# `model.task_params.return_dict: true` requests harm_amps/noise_amps as
# extra pred entries (tasks.codecs.NoiseGenerationCodec) for
# conf/loss/multiscale_stft_smoothness.yaml's smoothness terms. Same
# offline-dataset deviation as E2 (see conf/experiment/e2_noise_gen_dregon_michaels.yaml)
# plus conf/data/noise_rps_dregon_michaels_swapped.yaml's own
# swapped-split caveat (REPLICATION.md § E2/E3).
defaults:
  - override /data: noise_rps_dregon_michaels_swapped
  - override /model: positional_harmonic_gen_conditioned
  - override /loss: multiscale_stft_smoothness
  - override /metrics: noise_gen_spectral

experiment_name: e3_noise_gen_swapped_smoothness
epochs: 200
patience: 20
batch_size: 32
grad_clip: 1.0
model:
  task_params:
    return_dict: true
optim:
  optimizer: adam
  lr: 0.001
  monitor: mrstft
  monitor_mode: max
