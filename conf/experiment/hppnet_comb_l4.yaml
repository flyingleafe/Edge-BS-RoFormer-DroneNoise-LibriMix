# @package _global_
# ARM A — hppnet_rps on the analytic STATIC-COMB curriculum, validated on a
# held-out draw of that same family.
#
# THE QUESTION. docs/harmonic-ports-design.md argues that the multi-pitch
# architectures fail here for a structural reason — they gather harmonic
# evidence on a log axis, where the separation-to-bandwidth ratio of two rotors
# is independent of the harmonic index, so a close pair is unresolvable at every
# harmonic at once. This row asks whether removing that one organ is enough:
# the model is HPPNet's trunk and its FreqGroupLSTM with the harmonic gather
# moved onto the linear STFT, and the task is the easiest harmonic family the
# project has.
#
# THE PAIRING is conf/experiment/sal150_comb.yaml exactly — same stream
# (conf/online_mix/m3abl_comb_s1_dload.yaml through conf/data/sal_comb_synthval.yaml),
# same held-out-same-family validation, same epoch size, same batch, same
# monitor. Three things differ, and all three are the port:
#   1. The model, from multif0_salience (LateDeep CNN over HCQT) to hppnet_rps.
#   2. The grid, from 0-150 in 1000 bins to 0-150 in 300 bins (0.5 rev/s — the
#      design note's error table says the finer grid buys nothing once the
#      peak is log-parabola-interpolated).
#   3. The frame rate, from [16000, 256] (the HCQT hop) to [16000, 512] (this
#      project's STFT hop, which is what the port's front end runs on).
# So sal150_comb is the reference this row is read against, and hb_sal_multif0
# (flight MAE 4.01 on real data) is the reference sal150_comb was read against.
#
# WHY SAME-FAMILY VALIDATION: conf/data/sal_comb_synthval.yaml's header. The row
# asks whether the architecture can learn the task, not whether it transfers,
# so halting on a real-split metric would confound the two.
#
# ─── THE L4 VARIANT ───────────────────────────────────────────────────────
# This row is its `_l4`-less twin with the OUTPUT REPRESENTATION replaced, and
# nothing else: same stream, same validation draw, same epoch budget, patience,
# batch size, workers and monitor. Three files change together and they must:
#   model   -> conf/model/*_rps_l4.yaml   (n_maps 4: one salience layer per rotor)
#   loss    -> conf/loss/salience_layers_r150.yaml     (Gaussian layers, PIT BCE)
#   metrics -> conf/metrics/salience_layers_r150.yaml  (the same, plus rps_mae)
#
# WHY. `models.salience_crf` encoded real training telemetry into the shared
# salience map and decoded it back — a PERFECT target, no model involved — and
# got the trajectory back 8.24 rev/s away on average, with 39-45% of frames more
# than half a bin off. Gaussian per-rotor layers with the CRF readout return
# 2.22e-16. The old number is an ORACLE FLOOR: no model reading that
# representation could have scored better, so every `_l4`-less row above was
# measuring the representation as much as the architecture. This row removes
# that ceiling and leaves the architecture question intact.
#
# At eval the decode is `models.harmonic_ports.layer_readout.LayerCRFReadout` —
# one CRF best path per layer, NO threshold and NO Hungarian step. A stopped
# rotor is the path sitting at bin 0, which is a value; the old decoder had to
# call it an absence, which is what forced the threshold.
defaults:
  - override /data: sal_comb_synthval
  - override /model: hppnet_rps_l4
  - override /loss: salience_layers_r150
  - override /metrics: salience_layers_r150

experiment_name: hppnet_comb_l4
epochs: 200
patience: 20
batch_size: 16  # frames (= 2 chunks x 8 mics) — sal150_comb's value, kept
num_workers: 6
samples_per_validation: 16000
optim:
  monitor: bce
  monitor_mode: min
