# @package _global_
# F1 MP-SENet (parallel magnitude+phase, generator-only ~1.7M) — Pass B (all harmonic noises (category-uniform)). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_b
  - override /model: f1_mpsenet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_mpsenet_b
# fp16 autocast + GradScaler (STFT/iSTFT stay fp32 inside the model); the
# first pass hit the 16 h wall at ~epoch 67 still improving — throughput fix.
# bf16 was tried first and NaN-poisoned the weights at epoch-0 step ~407
# (no scaler step-skip in bf16); fp16's GradScaler skips overflowed steps.
amp: true
amp_dtype: float16
resume: true  # chainable across wall-limited job segments (last.ckpt)
samples_per_validation: 20000
epochs: 150
patience: 30
optim:
  monitor: si_sdr
  monitor_mode: max
  patience: 15
