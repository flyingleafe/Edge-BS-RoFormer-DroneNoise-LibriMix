# @package _global_
# F1 TF-GridNet (dense full+sub-band dual-path, mid-size ~8.4M) — Pass A (drone noises only). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_a
  - override /model: f1_tfgridnet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_tfgridnet_a
amp: false  # complex STFT/iSTFT (ComplexHalf gaps under autocast)
batch_size: 4  # TF-GridNet is memory-heavy (batch 16 OOMs @ 63GB); effective 16 via grad accum
grad_accum_steps: 4
samples_per_validation: 20000
epochs: 150
patience: 30
optim:
  monitor: si_sdr
  monitor_mode: max
  patience: 15
