# @package _global_
# CURRICULUM RUNG 1 of 4 — realized comb contrast 11.5 dB, warm-started from rung 0 (`ladder_r0_scv2`).
#
# The ladder walks the stochastic family from its most resolvable corner to its
# full range. Rung 4 is the full family, so a model that finishes the ladder has
# arrived at the distribution every stochastic arm in the transfer campaign
# trained on directly.
#
# WHY THESE AXES AND NOT THE VARIANCES. The campaign opened on the premise that
# the analytic static comb is the zero-variance corner of this family. It is not:
# comb contrast is 15 to 25 dB for the static comb and 7 to 8 dB for every
# stochastic variant, including one with every variance knob zeroed. Zeroing all
# of them moves contrast by less than the measurement's own spread, and the floor
# depth moves it by 0.0 dB. `rolloff_p` and `gamma_slope_hz` are what move it.
# Full measurement: docs/experiments/synthetic-solvability-limits.md.
#
# WHY PATIENCE AND NOT A FIXED RUNG LENGTH. Each rung trains until its OWN
# validation stops improving, rather than for a step count fixed in advance.
# This is still calibrated on the comb-only experiments — they set what patience
# has to be — but it lets a harder rung take the epochs it needs instead of being
# cut at a length measured on an easier one. The comb-only arms make the case:
# all three were still descending when they stopped, at 21 to 59 epochs
# (slopes −0.136, −0.079, −0.041 per epoch), so any fixed length read off them
# would have been an underestimate of the wrong quantity.
#
# Validation is half real and half synthetic, the synthetic half drawn from THIS
# rung's policy. The real half is the frozen split and is identical at every
# rung, so the ladder yields two curves: how the achievable synthetic fit decays
# as the family widens, and whether real-rig transfer follows it or breaks away.
defaults:
  - override /data: ladder_r1
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: ladder_r1_scv2
checkpoint: r2://ml-data/artifacts/ladder_r0_scv2/checkpoints/best.ckpt
epochs: 2000
patience: 200
batch_size: 128  # frames (= 16 chunks x 8 mics)
num_workers: 6
samples_per_validation: 40000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
