# @package _global_
# Phase-only readout arm on the fs_v2 protocol with 4 s training chunks
# (conf/online_mix/e12_fullflight_freqscale_v2_8s_dload.yaml — duration_s
# 8.0 instead of 1.0). Clone of ckla_phaseonly_fs_v2; batch_size scaled DOWN
# 4x (128 -> 32 frames) so per-step memory (frames x time) stays equal.
defaults:
  - override /data: e12_real_fullflight
  - override /model: simple_conv_v2_ckla_phaseonly
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: ckla_phaseonly_8s
epochs: 200
patience: 20
batch_size: 16  # frames (= 2 chunks x 8 mics); 8x fewer than fs_v2 — each frame is 8x longer
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics; an epoch now spans 8x the audio-time)
grad_clip: 1.0  # phase_only readout: atan2 near zero phasor -> exploding grads (NaN killed a seed run); clip at 1.0
data:
  train:
    params:
      path: conf/online_mix/e12_fullflight_freqscale_v2_8s_dload.yaml
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
