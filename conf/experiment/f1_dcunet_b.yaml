# @package _global_
# F1 DCUNet (complex UNet; 2023 benchmark winner, continuity anchor) — Pass B (all harmonic noises (category-uniform)). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_b
  - override /model: a1_baseline_dcunet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_dcunet_b
amp: false  # complex STFT/iSTFT (ComplexHalf gaps under autocast)
samples_per_validation: 20000
epochs: 150
patience: 30
optim:
  monitor: si_sdr
  monitor_mode: max
  patience: 15
