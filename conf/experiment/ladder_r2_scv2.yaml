# @package _global_
# CURRICULUM RUNG 2 of 4 — gamma_slope_hz [0.02, 0.15], warm-started from rung 1 (`ladder_r1_scv2`).
#
# ONE AXIS: how fast a harmonic line broadens with its own order. Rung 0 is a
# sharp comb, rung 4 is the full family; `rolloff_p` and `gamma0_hz` hold at the
# family default throughout, so exactly one thing changes along the ladder.
#
# WHY LINE WIDTH AND NOT THE VARIANCES. The campaign opened on the premise that
# the static comb is the zero-variance corner of this family. It is not: zeroing
# every knob named variance moves comb contrast by less than the measurement's
# own spread, and the floor depth moves it by 0.0 dB. Line width is the one knob
# that moves contrast monotonically, and it is the single structural difference
# from the static comb, whose lines have no width at all.
#
# WHAT THIS LADDER DOES NOT ASSUME. An earlier version ordered the rungs by
# peak-to-bulk contrast and was withdrawn: a model-free harmonic-sum estimator
# showed the highest-contrast rung was the HARDEST, because that contrast came
# from steepening the rolloff, which raises the ratio by killing the harmonics
# there are to lock onto. Contrast is not a difficulty measure. The same probe
# is too unstable to order these rungs either — its per-clip error is bimodal,
# locking near 0.2 rev/s or failing near 20 — so the ladder does not claim a
# difficulty ordering in advance. The runs measure it.
#
# Validation is half real and half synthetic, the synthetic half drawn from THIS
# rung's policy, the real half the frozen split and identical at every rung. Two
# curves come out: how the achievable synthetic fit decays as lines broaden, and
# whether real-rig transfer follows it or breaks away.
#
# WHY PATIENCE 100. The comb-floor runs supplied the calibration this ladder was
# waiting for. Trained to saturation on the static comb, all three arms found
# their floor early and then never improved on it: `base` at epoch 46 and 202
# epochs past it, `deep` at 60 and 201 past, `wide` at 39. Saturation on a
# comb-only task takes 40 to 60 epochs, so patience 100 is more than twice the
# observed requirement and no arm would have been truncated by it — while
# patience 200 spent about 200 idle epochs per arm.
#
# Patience rather than a fixed step count, because a wider rung may need longer
# than a sharp one and the ladder does not assume it knows which.
# Batch doc: docs/experiments/synthetic-solvability-limits.md.
defaults:
  - override /data: ladder_r2
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: ladder_r2_scv2
checkpoint: r2://ml-data/artifacts/ladder_r1_scv2/checkpoints/best.ckpt
epochs: 2000
patience: 100
batch_size: 128  # frames (= 16 chunks x 8 mics)
num_workers: 6
samples_per_validation: 5000  # frames; an 8 s clip is 8x a 1 s one
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
