# @package _global_
# C8 narrow-band + super-resolution variant — see
# .pi/checkpoints/salience-narrow-superres-experiment.md. Historical
# command: train_rps_predictor.py --model basic_pitch_salience --data_root
# datasets/DREGON-LM-V4 --device cuda:0 --epochs 200 --patience 15
# --bp_fmin 55 --bp_bins_per_semitone 4 --bp_n_contour_semitones 12
# --superres_out --out_fmin 55 --out_fmax 110 --out_bins 360
# --salience_blur_bins 2.
defaults:
  - override /data: dregon_lm_v4_8ch_flat
  - override /model: basic_pitch_salience_narrow_sr
  - override /loss: salience_bce_narrow_sr
  - override /metrics: salience_bce_narrow_sr

experiment_name: c8_basic_pitch_salience_narrow_sr
epochs: 200
patience: 15
optim:
  monitor: bce
  monitor_mode: min
