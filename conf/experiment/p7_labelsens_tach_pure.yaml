# @package _global_
# ARM B0 — the staircase ALONE. Arm B's label transform at unit scale: no
# 0.542 % bias, only the refresh-interval mean, the 0.269 rev/s quantization
# lattice and the 49.7 Hz zero-order hold. Label error 0.106 rev/s rms, which
# displaces harmonic k by 0.106*k Hz — about one bin at k = 80 at the loss's
# finest scale (n_fft 2048, 7.8 Hz bins).
#
# Arms A/S/B/C answered "the staircase" only as the difference B - S, which
# assumes the two corruptions compose additively in the arm's response. This
# arm measures it directly against A, and the model-free pressure predicts
# 1.18 dB at k50-80 (docs/experiments/generator-label-sensitivity.md).
#
# Byte-identical to p7_labelsens_tach except data.{train,valid}.params.
# label_scale, which the shared conf/data/static_comb_gen.yaml sets to
# 0.99458. Same seed, same epoch/patience budget, same optimizer — the
# comparison is only meaningful at a shared budget.
defaults:
  - override /data: static_comb_gen
  - override /model: positional_harmonic_gen
  - override /loss: multiscale_stft
  - override /metrics: noise_gen_spectral

experiment_name: p7_labelsens_tach_pure
seed: 1234
epochs: 40
patience: 8
batch_size: 32
num_workers: 6
grad_clip: 1.0
optim:
  optimizer: adam
  lr: 0.001
  monitor: mrstft
  monitor_mode: max

# fp16 autocast breaks the emitter: freqs_to_phasors uses a complex cumprod and
# "cumprod_cuda" is not implemented for ComplexHalf (E6 finding).
amp: false

data:
  train:
    params:
      label_mode: tach
      label_scale: 1.0
  valid:
    params:
      label_mode: tach
      label_scale: 1.0
