# @package _global_
# F1 TF-GridNet (dense full+sub-band dual-path, mid-size ~8.4M) — Pass B (all harmonic noises (category-uniform)). Blind SE (no RPS).
# See docs/experiments/f1-se-blind-baselines.md.
defaults:
  - override /data: se_baselines_b
  - override /model: f1_tfgridnet
  - override /loss: si_sdr_mrstft
  - override /metrics: separation_basic

experiment_name: f1_tfgridnet_b
# fp16 autocast (STFT/iSTFT stay fp32 inside the model) — see
# f1_tfgridnet_a.yaml for the throughput diagnosis.
amp: true
amp_dtype: float16  # fp16 + GradScaler: cuDNN LSTM fp16 is the well-paved path
                    # (bf16 LSTM autocast is spotty); LayerNorm-heavy blocks
                    # keep activations bounded
batch_size: 8  # fp32 batch 16 OOMed @ 63GB; fp16 halves activations
grad_accum_steps: 2  # effective 16
resume: true  # chainable across wall-limited job segments (last.ckpt)
samples_per_validation: 20000
epochs: 150
patience: 30
optim:
  monitor: si_sdr
  monitor_mode: max
  patience: 15
