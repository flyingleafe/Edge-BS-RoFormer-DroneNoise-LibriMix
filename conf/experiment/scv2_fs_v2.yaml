# @package _global_
# Beat-VK scoreboard arm: SimpleConvV2 under the fs_v2 uniform freq-scale
# regime (exact clone of g2_if_freqscale_v2 with the model swapped) so the
# architecture comparison is regime-matched.
defaults:
  - override /data: e12_real_fullflight
  - override /model: simple_conv_v2
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: scv2_fs_v2
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics — legacy-equivalent epoch)
data:
  train:
    params:
      path: conf/online_mix/e12_fullflight_freqscale_v2_dload.yaml
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
