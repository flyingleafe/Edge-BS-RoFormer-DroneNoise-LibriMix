# @package _global_
# G2b — IF-augmented-STFT front-end arm of the VK-parity push (criterion 2.3;
# see docs/experiments/g1-vk-parity.md § Phase G2). Mirrors
# e12_real_fullflight_transformer EXACTLY (same e12_real_fullflight online-mix
# stream, 1 s chunks, pit_mse, augs, patience 20) except the model: the
# simple_conv_v2_transformer trunk gets log-magnitude + instantaneous-frequency
# channels (stft_mag_if) instead of magnitude alone — sub-bin frequency
# evidence targeting the systematic within-window RPS error that phases A
# (smoothing) and B (longer context) failed to remove.
defaults:
  - override /data: e12_real_fullflight
  - override /model: simple_conv_v2_transformer_if
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: g2_if_transformer
epochs: 200
patience: 20
batch_size: 16
num_workers: 6
samples_per_validation: 5000
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
