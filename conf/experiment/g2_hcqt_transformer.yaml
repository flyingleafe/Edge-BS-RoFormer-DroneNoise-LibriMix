# @package _global_
# G2a — HCQT front-end arm of the VK-parity push (criterion 2.3; see
# docs/experiments/g1-vk-parity.md § Phase G2). Mirrors
# e12_real_fullflight_transformer EXACTLY (same e12_real_fullflight online-mix
# stream, 1 s chunks, pit_mse, augs, patience 20) except the model: the
# simple_conv_v2_transformer trunk gets a harmonic-stacked HCQT front-end
# instead of log-magnitude STFT — isolating the front-end effect on the
# systematic within-window RPS error that phases A (smoothing) and B (longer
# context) failed to remove.
defaults:
  - override /data: e12_real_fullflight
  - override /model: simple_conv_v2_transformer_hcqt
  - override /loss: pit_mse
  - override /metrics: rps

experiment_name: g2_hcqt_transformer
epochs: 200
patience: 20
batch_size: 128  # frames (= 16 chunks x 8 mics — legacy-equivalent effective batch)
num_workers: 6
samples_per_validation: 40000  # frames (= 5000 chunks/epoch at 8 mics — legacy-equivalent epoch)
optim:
  lr: 0.001
  weight_decay: 0.0001
  monitor: mse
  monitor_mode: min
