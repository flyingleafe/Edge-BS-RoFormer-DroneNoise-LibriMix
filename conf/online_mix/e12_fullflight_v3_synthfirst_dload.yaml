# SYNTHESIS-FIRST v3 (2026-07-27): single stage, no unaugmented warmup.
# freq_scale + noise_time_warp are VALID-DATA SYNTHESIS (they manufacture new
# correctly-labeled (audio, RPS) pairs), so they are always on from sample 0:
# probability 1.0 for both. The G6 corruption pack (spectral_recolor,
# random_reverb, tooth_dropout, spec_mask, floor_inject) and the post-mix
# augmentations are CORRUPTION — they ramp in linearly, p 0 -> 0.7 over
# epochs 5 -> 25 (25000 -> 125000 chunks at 5000 chunks/epoch), replacing the
# hard two-stage warmup switch of v2/G6 with a gradual schedule.
# noise_augmentations is a LIST of blocks applied sequentially: block 0 is the
# v2 freq_scale (always fires), block 1 is the ramped corruption pack.
# Sources, snr, min_motor_rps, task and seed are identical to
# e12_fullflight_freqscale_v2_dload.yaml.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: {ramp: {from: 25000, until: 125000, start: 0.0, end: 0.7}}
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop deliberately absent (see the v2 policy: with
          # flatten_channels a zeroed channel becomes a silent mono frame
          # carrying nonzero RPS labels — trains prior-regression).
      noise_augmentations:
        # Block 0 — synthesis: every chunk freq-scaled (v2's block, unchanged).
        - probability: 1.0
          choices:
            - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
        # Block 1 — corruption pack (G6 five, standard severities), ramped.
        - probability: {ramp: {from: 25000, until: 125000, start: 0.0, end: 0.7}}
          choices:
            - spectral_recolor: {gain_db: 8.0, n_anchors: 10, f_low: 30.0, f_high: 8000.0}
            - random_reverb: {n_rirs: 200, rt60_low: 0.1, rt60_high: 0.8, drr_low_db: 3.0, drr_high_db: 15.0}
            - tooth_dropout: {max_teeth: 4, max_harmonic: 25, halfwidth_bins: 2}
            - spec_mask: {max_freq_masks: 3, freq_width_hz: [50.0, 400.0], max_time_masks: 2, time_width_ms: 100.0}
            - floor_inject: {tilt_low: 0.0, tilt_high: 2.0, level_low_db: -20.0, level_high_db: 0.0}
      noise_time_warp:
        probability: 1.0
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
