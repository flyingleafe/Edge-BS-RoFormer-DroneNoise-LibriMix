# M3ABL 3 — "MIXED, NO CURRICULUM": ONE single-stage stream that pools the REAL
# recordings and BOTH synthetic sources at once, instead of the two-stage M3CUR
# curriculum (synthetic pre-train -> real fine-tune).
#
# ABLATION QUESTION: is the curriculum necessary, or does mixed training with
# the same augmentations suffice? M3CUR pays for two runs and a warm start; if
# one mixed run reaches the same validation place, the ordering (synthetic
# first, real second) carries no information and the curriculum is ceremony.
#
# POOL SHARES. The two real sources carry NO explicit weight, so they merge into
# one duration-weighted real pool whose pool-level weight is the number of
# merged items (2.0). The generator and the comb each carry `weight: 1.0`. The
# pool is therefore real : generator : comb = 2 : 1 : 1 = 50% / 25% / 25% — real
# data at half the stream, and the synthetic half split exactly as m3cur stage 1
# splits it.
#
# The real sources are the m3cur STAGE 2 sources verbatim (DREGON
# `in_flight_noise` minus `free-flight_nosource_room1` and Michael's FLY125,
# both `min_motor_rps: 0.0`, so the WHOLE envelope stays in). The synthetic
# sources are the m3cur STAGE 1 sources verbatim, including the generator's ep30
# checkpoint, full-flight excitation and the `perrotor_noise` /
# `rotor_jitter_std` vicinal knobs. The policy block is m3cur's, unchanged: ONE
# stage, all three augmentation blocks from sample 1.
#
# There is no stage 2 and no warm start — this is a single run per architecture.
# Validation stays fixed/real (conf/data/m3abl_mixed.yaml ->
# dload:DREGON-LM-V4-michaels-valid-full), so it is read against m3cur stage 2
# on one curve.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    # --- 50% (2.0 of 4.0): the REAL recordings, whole envelope ---
    # No explicit weight: these two merge into ONE duration-weighted real pool
    # at pool weight 2.0.
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0

    # --- 25% (1.0 of 4.0): the M3 per-rotor neural generator, full-flight ---
    - kind: generated
      weight: 1.0
      checkpoint: r2://ml-data/artifacts/gen_m3_refined_all_perrotor/checkpoints/ep30_mrstft_6.7391.ckpt
      n_harmonics: 100                # MUST match the checkpoint's training value
      device: cuda:0                  # the ONE extra CUDA context (producer)
      dregon_dir: "dload:DREGON"      # geometry on a machine with no data/ tree
      gen_batch: 32
      random_phase: true
      refresh: true                   # live stream (never validate on it)
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_fs: 200.0
      interp:
        endpoints: [dregon, michaels] # codebook names defining the segment
        alpha: {low: 0.0, high: 1.0}  # uniform alpha along the segment (per batch)
        embedding_noise: 0.15         # Gaussian std around z(alpha), in units of ||z1-z0||
        rotor_interp: true            # interpolate rotor positions at alpha
        jitter_sigma: interp          # blend the learned per-drone OU sigma at alpha
        perrotor_noise: 0.5           # redraw the per-rotor code deltas each batch
        rotor_jitter_std: 0.2         # meters, per rotor per coordinate, each batch
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02            # per-mic 3D Gaussian std (meters)
      buffer: {slots: 512, warmup: 32}

    # --- 25% (1.0 of 4.0): analytic static-comb, full-flight (zero -> silence) ---
    - kind: static_comb
      weight: 1.0
      n_harmonics: 100
      n_mics: 8
      n_rotors: 4
      min_harm_above_floor: 0.30
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_reuse: 32

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up: mixtures + all three augmentation blocks from
    # sample 1 (identical to m3cur stage 1).
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED: with flatten_channels each zeroed channel
          # becomes a mono frame of pure silence carrying nonzero RPS labels,
          # contradicting the silence==zero-RPS convention.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
