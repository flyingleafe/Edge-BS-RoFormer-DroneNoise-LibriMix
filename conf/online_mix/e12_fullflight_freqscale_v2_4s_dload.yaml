# FREQ-SCALE v2, 4-SECOND CHUNKS (2026-07-29): byte-identical to
# e12_fullflight_freqscale_v2_dload.yaml except duration_s 1.0 -> 4.0 — the
# longer-window training arm (each generated chunk / training frame is 4 s of
# audio, 126 STFT frames instead of 32). Pair with batch_size scaled DOWN 4x
# in the experiment file (128 -> 32 frames) to keep per-step memory equal.
# `until:` stays in GENERATED CHUNKS: 50000 chunks is still effective epoch 10
# at samples_per_validation=40000 frames (5000 chunks/epoch at 8 mics) — an
# epoch now just covers 4x the audio-time.

sample_rate: 16000
duration_s: 4.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      cache:
        mode: packed_int16
        dir: "${oc.env:ONLINE_MIX_SOURCE_CACHE_DIR,.cache/online_mix_sources}"

policy:
  stages:
    # First 50k chunks: random speech/noise mixtures, no augmentation
    # (effective epoch 10 — see header).
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, freq-scale
    # EVERY noise chunk (fs_v2), and independently time-warp 50% of noise
    # chunks (noise+RPS pair) — matches the E5/E11 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (see fs_v2 policy: with flatten_channels a
          # zeroed channel becomes a silent mono frame carrying nonzero RPS
          # labels — trains prior-regression).
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
