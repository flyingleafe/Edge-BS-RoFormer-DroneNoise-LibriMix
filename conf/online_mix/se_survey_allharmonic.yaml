# F2 step 3 — the survey protocol of `se_avq_survey.yaml` with the training
# noise pool widened from AVQ-only to ALL HARMONIC noise sources.
#
# Single-variable design: every other knob is byte-identical to
# `conf/online_mix/se_avq_survey.yaml` (8 kHz, 3.0 s crops, SNR ~ U(-25,-5) dB,
# no augmentation, same LibriSpeech speech block with the same 25 held-out
# speakers, same base_seed). ONLY `sources.noise` changes. Validation stays on
# the fixed `SE-valid-avq-survey` set (see conf/data/f2_allharmonic.yaml).
#
# The noise list is the category-uniform harmonic pool of
# `conf/online_mix/se_all_harmonic.yaml` (F1 Pass B), copied over, PLUS the 5
# AVQ ego-noise sequences inside the `drone` category — so this pool is a strict
# SUPERSET of both the step-1 (AVQ-only) and step-2 (all-drone) pools.
#
# Category-uniform sampling over 6 categories so the 258 GiB MIMII cannot
# dominate: each category's source weights sum to 1.0.
#   drone   = AVQ + DREGON + Michael's + drone_audio + DroneAudioSet + SPCUP19 +
#             new-drone-noises  (7 sources)
#   mimii   = MIMII (1.0)
#   mimii_dg= MIMII-DG (1.0)
#   aircraft= AeroSonicDB (1.0)
#   motors  = HUSTmotor + KAIST-rotating-acoustic (0.5 each)
#   horns   = HornBase (1.0)
# JUDGEMENT CALL: F1 Pass B splits the drone category 6 ways at 0.16667 each;
# adding AVQ as a 7th drone source at that same weight would push the drone
# category to 7/6 and break the pool's defining invariant. The weights are
# therefore renormalised to 1/7 = 0.142857 each, which preserves
# category-uniformity — the property the pool exists for — while still adding
# AVQ. Relative weights *within* the drone category are unchanged.
#
# See docs/experiments/f2-survey-replication.md.

task: speech_enhancement
sample_rate: 8000
duration_s: 3.0
base_seed: 20260725

sources:
  noise:
    # --- category: drone (sum 1.0, 7 sources at 1/7) ---
    # step-1 in-domain source, kept so this pool is a superset
    - kind: audio_pool
      dataset: AVQ
      channel: 0 # paper uses the first array channel only
      # Exact sample keys of the 5 pure ego-noise sequences (the remaining
      # AVQ recordings carry the speech source).
      include_keys: [S1_seq1, S1_seq2, S1_seq3, S2_seq1, S2_seq2]
      weight: 0.142857
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 30.0
      weight: 0.142857
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
      weight: 0.142857
    - kind: audio_pool
      dataset: drone_audio
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.142857
    - kind: audio_pool
      dataset: DroneAudioSet
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.142857
    - kind: audio_pool
      dataset: SPCUP19-egonoise
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.142857
    - kind: audio_pool
      dataset: new-drone-noises
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.142857
    # --- category: mimii (1.0) ---
    - kind: audio_pool
      dataset: MIMII
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    # --- category: mimii_dg (1.0) ---
    - kind: audio_pool
      dataset: MIMII-DG
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    # --- category: aircraft (1.0) ---
    - kind: audio_pool
      dataset: AeroSonicDB
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    # --- category: motors (0.5 + 0.5) ---
    - kind: audio_pool
      dataset: HUSTmotor
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.5
    - kind: audio_pool
      dataset: KAIST-rotating-acoustic
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 0.5
    # --- category: horns (1.0) ---
    - kind: audio_pool
      dataset: HornBase
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      # Held-out valid speakers (every 10th id, sorted) — identical list to
      # conf/online_mix/se_avq_survey.yaml and scripts/build_se_valid.py's
      # HELDOUT_SPEAKERS, so train/valid speech never overlap.
      exclude:
        [19, 89, 211, 307, 445, 831, 1098, 1502, 1898, 2182, 2764, 3168, 3526,
         3982, 4267, 4813, 5322, 5703, 6081, 6476, 7067, 7312, 7800, 8238, 8630]
      # No packed cache: this stream is mono (one utterance per sample, vs the
      # 8-channel RPS streams' eight), so direct FLAC decode keeps up, and an
      # 8 kHz cache would duplicate the existing 16 kHz ones on disk.
      cache:
        mode: none

policy:
  source_prob: 1.0
  snr_db:
    uniform: {low: -25.0, high: -5.0}
  speech_per_channel: independent
  snr_per_channel: false
  # No augmentations — the paper mentions none (and step 1 has none).
