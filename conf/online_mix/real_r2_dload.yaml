# REALITY LADDER, RUNG 2 — ONE rig, ALL 8 microphones, no label-transforming
# augmentation. Rung 1 plus the array.
#
# THE ONE DIFFERENCE FROM `real_r1_dload.yaml`: the source's `channels` filter
# is gone, so every chunk carries the full 8-microphone ring, the speech lane
# count returns to 8 (`speech_per_channel: independent`) and
# `flatten_channels: true` yields EIGHT training frames per chunk. The silence
# arm follows at `n_channels: 8`. Sources, seeds, SNR range, silence share and
# the post-mix block are rung 1 verbatim.
#
# WHAT THE PAIR MEASURES. R1 to R2 is the only place in the matrix where the
# microphone count moves on its own. Eight mono views of one 8-channel chunk
# are eight times the training frames, but they are the SAME flight seconds
# with the same labels, so the difference is what the array adds and not what
# more data adds.
#
# THE LADDER and WHAT IS REMOVED: see the header of real_r1_dload.yaml.
# Batch doc: docs/experiments/paper-regime-matrix.md.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.2
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up: mixtures and the post-mix block from sample 1.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
