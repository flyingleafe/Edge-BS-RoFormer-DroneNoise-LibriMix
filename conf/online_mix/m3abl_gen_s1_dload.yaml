# M3ABL 2 — "GENERATOR ONLY" stage 1: m3cur_s1_dload.yaml with the
# `kind: static_comb` source REMOVED, so the M3 per-rotor neural generator is
# the WHOLE synthetic noise pool.
#
# ABLATION QUESTION: does the analytic comb add anything on top of the neural
# generator? M3CUR stage 1 keeps the comb at 50% as a spacing-only anchor with
# no timbre model; if the generator alone reaches the same place after the real
# fine-tune (stage 2), the comb half is redundant and stage 1 can be halved.
#
# Everything else is m3cur stage 1 verbatim: same sample rate / duration /
# base_seed, the same generator settings (ep30 checkpoint, full-flight RPS, the
# interp block with `perrotor_noise: 0.5` and `rotor_jitter_std: 0.2`, the same
# buffer), the same speech source, and the identical single-stage policy with
# all three augmentation blocks firing from sample 1.
#
# Stage 2 is the SAME real fine-tune as m3cur (conf/online_mix/m3cur_s2_dload.yaml)
# — the ablation is on stage 1 only. Validation stays fixed/real
# (conf/data/m3abl_gen_s1.yaml -> dload:DREGON-LM-V4-michaels-valid-full).

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    # --- 100%: the M3 per-rotor neural generator, full-flight excitation ---
    - kind: generated
      weight: 1.0
      checkpoint: r2://ml-data/artifacts/gen_m3_refined_all_perrotor/checkpoints/ep30_mrstft_6.7391.ckpt
      n_harmonics: 100                # MUST match the checkpoint's training value
      device: cuda:0                  # the ONE extra CUDA context (producer)
      dregon_dir: "dload:DREGON"      # geometry on a machine with no data/ tree
      gen_batch: 32
      random_phase: true
      refresh: true                   # live stream (never validate on it)
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_fs: 200.0
      interp:
        endpoints: [dregon, michaels] # codebook names defining the segment
        alpha: {low: 0.0, high: 1.0}  # uniform alpha along the segment (per batch)
        embedding_noise: 0.15         # Gaussian std around z(alpha), in units of ||z1-z0||
        rotor_interp: true            # interpolate rotor positions at alpha
        jitter_sigma: interp          # blend the learned per-drone OU sigma at alpha
        perrotor_noise: 0.5           # redraw the per-rotor code deltas each batch
        rotor_jitter_std: 0.2         # meters, per rotor per coordinate, each batch
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02            # per-mic 3D Gaussian std (meters)
      buffer: {slots: 512, warmup: 32}

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up: mixtures + all three augmentation blocks from
    # sample 1 (identical to m3cur stage 1).
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED: with flatten_channels each zeroed channel
          # becomes a mono frame of pure silence carrying nonzero RPS labels,
          # contradicting the silence==zero-RPS convention.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
