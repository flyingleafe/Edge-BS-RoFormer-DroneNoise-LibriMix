# F2 — online-mix SE policy replicating Mukhutdinov et al. 2023 (IEEE Access,
# "Deep Learning Models for Single-Channel Speech Enhancement on Drones"),
# with the AVQ ego-noise recordings standing in for the survey's drone noise.
#
# Paper setup reproduced here:
#   - everything at 16 kHz (the project's native rate — the paper's 8 kHz is
#     NOT replicated, see docs/experiments/f2-survey-replication.md), 3.0 s
#     crops (T = 48000 samples);
#   - noise = the drone ego-noise recordings, FIRST CHANNEL ONLY, reused for
#     BOTH train and valid (only the speech is split);
#   - speech = TIMIT 90/10 split -> substituted by LibriSpeech train-clean-100,
#     with the same held-out ~10% of speakers the F1 SE valid sets reserve;
#   - train SNR ~ U(-25, -5) dB, mixed on the fly;
#   - no augmentation (the paper describes none).
#
# The noise pool is `AVQ-egonoise` — a purpose-built derived dataset holding
# EXACTLY the wanted audio (the 5 pure ego-noise sequences of AVQ, channel 0,
# 16 kHz mono, ~705 s / 43 MiB in one shard; the other 7 AVQ recordings contain
# the speech source and are simply not in it). It replaces the former
# `dataset: AVQ` + `channel: 0` + `include_keys: [...]` entry: dload manifests
# carry no per-shard key list, so key filtering had to OPEN all 11 AVQ shards
# (~4 GiB) to find the 5 sequences, and one of those is a 352 MB multipart
# object that s3transfer's ETag check rejects on some boto3 builds (Kaggle).
# Publisher: data_processing.derivations (frame_subset generator). See
# docs/experiments/f2-survey-replication.md.

task: speech_enhancement
sample_rate: 16000
duration_s: 3.0
base_seed: 20260725

sources:
  noise:
    - kind: audio_pool
      # The whole dataset IS the wanted audio: the 5 pure ego-noise sequences,
      # first array channel only (the paper's choice), 16 kHz mono. Hence no
      # `include_keys` and no `channel`.
      dataset: AVQ-egonoise
      weight: 1.0
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
      # Held-out valid speakers (every 10th id, sorted) — identical list to
      # conf/online_mix/se_drone_only.yaml and data_processing.derivations (se_valid generator)'s
      # HELDOUT_SPEAKERS, so train/valid speech never overlap.
      exclude:
        [19, 89, 211, 307, 445, 831, 1098, 1502, 1898, 2182, 2764, 3168, 3526,
         3982, 4267, 4813, 5322, 5703, 6081, 6476, 7067, 7312, 7800, 8238, 8630]
      # No packed cache: this stream is mono (one utterance per sample, vs the
      # 8-channel RPS streams' eight), so direct FLAC decode keeps up.
policy:
  source_prob: 1.0
  snr_db:
    uniform: {low: -25.0, high: -5.0}
  speech_per_channel: independent
  snr_per_channel: false
  # No augmentations — the paper mentions none.
