# F1 Pass A — drone-noise-only SE online-mix policy (blind, no RPS).
# SE-target mode (`task: speech_enhancement`): the stream yields
# (mixture, clean_speech) pairs. Noise = real DREGON/Michael's drone frames
# (training recordings; valid recordings held out) + `audio_pool` over the
# open drone-noise datasets, roughly uniform over sub-datasets. Speech =
# LibriSpeech train-clean-100 with the 25 valid speakers excluded.
# Everything streams from R2 via dload (portable to any backend).
# See docs/experiments/f1-se-blind-baselines.md.

task: speech_enhancement
sample_rate: 16000
duration_s: 1.0
base_seed: 20260720

sources:
  noise:
    # Real target-domain drones (valid holds out room1 + FLY124).
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 30.0
      weight: 1.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
      weight: 1.0
    # Open drone-noise datasets (train side of the per-shard/recording holdout;
    # valid_shards: 2 kept complementary to scripts/build_se_valid.py).
    - kind: audio_pool
      dataset: drone_audio
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: DroneAudioSet
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: SPCUP19-egonoise
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: new-drone-noises
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      # Held-out valid speakers (every 10th id, sorted) — kept out of training.
      exclude:
        [19, 89, 211, 307, 445, 831, 1098, 1502, 1898, 2182, 2764, 3168, 3526,
         3982, 4267, 4813, 5322, 5703, 6081, 6476, 7067, 7312, 7800, 8238, 8630]
      cache:
        mode: packed_int16
        dir: "${oc.env:ONLINE_MIX_SOURCE_CACHE_DIR,.cache/online_mix_sources}"

policy:
  source_prob: 1.0
  snr_db:
    uniform: {low: -30.0, high: 0.0}
  speech_per_channel: independent
  snr_per_channel: false
  augmentations:
    probability: 0.5
    choices:
      - random_gain: {min_db: -6.0, max_db: 6.0}
      - random_polarity: {}
