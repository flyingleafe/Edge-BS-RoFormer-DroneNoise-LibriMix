# CROSS-RIG REAL CONTROL, MICHAEL'S HALF ONLY.
#
# The campaign compares synthetic-only models against `r4hb_scv2`, but that
# target is not one baseline. It fine-tunes on Michael's FLY125 and is scored on
# FLY124 — the same aircraft, the same 8-mic ring, an adjacent flight — while on
# DREGON it trains on room2 and is scored on room1. Its Michael's column is
# therefore close to an in-domain number, and that is exactly the column where
# the whole remaining synthetic-only gap sits.
#
# This control removes the ambiguity: Michael's FLY125 noise only, so the model has never
# heard DREGON. Its DREGON column is then a TRUE cross-rig number, and it says
# what a real-trained model is actually worth on an aircraft it has not met —
# which is the only fair bar for a model trained on no real audio at all.
#
# EXACTLY hb_m3s2_dload.yaml otherwise, including the warm start from
# `m3abl_comb_scv2_s1`. The silence weight drops 0.4 -> 0.2 because the merged
# real pool loses one item (2.0 -> 1.0), and 0.2/1.2 keeps the zero share at the
# same 16.7% the honest-base regime is defined by. Without that the regime mix
# would shift too and the control would confound two changes.
#
sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.2
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up (see the header): mixtures + all three augmentation
    # blocks from sample 1, at the fs_v2 settings.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (2026-07-27): with flatten_channels each
          # zeroed channel becomes a mono training frame of pure silence
          # carrying nonzero RPS labels — contradicts the silence==zero-RPS
          # convention and trains prior-regression.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
