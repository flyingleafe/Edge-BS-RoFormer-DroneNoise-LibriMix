# Cloud/portable twin of rps_generated_only_interp.yaml (colab / kaggle / vast —
# no local data/ checkout or GPFS). Identical vicinal-interp generated-noise
# policy, but every source streams from R2: the generator checkpoint via an
# r2:// URI (resolve_checkpoint_uri downloads + caches it in the producer) and
# speech from the raw librispeech dload dataset. Read-only. See
# rps_generated_only_interp.yaml for the full description of the sampling scheme.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260711

sources:
  noise:
    - kind: generated
      checkpoint: r2://ml-data/artifacts/e6_noisegen_jitter_latreg_perdrone/checkpoints/best.ckpt
      n_harmonics: 100
      device: cuda:0
      dregon_dir: "dload:DREGON"      # DREGON geometry (micPos/rotorsPos) streamed from R2
      gen_batch: 32
      random_phase: true
      refresh: true
      rps:
        kind: synthetic_intermittent
        aggressiveness: 1.0
      interp:
        endpoints: [dregon, michaels]
        alpha: {low: 0.0, high: 1.0}
        embedding_noise: 0.15
        rotor_interp: true
        jitter_sigma: interp
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02
      buffer:
        slots: 512
        warmup: 32

  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      cache:
        mode: packed_int16
        dir: "${oc.env:ONLINE_MIX_SOURCE_CACHE_DIR,.cache/online_mix_sources}"

policy:
  source_prob: 1.0
  snr_db:
    uniform: {low: -30.0, high: 0.0}
  speech_per_channel: independent
  snr_per_channel: false
