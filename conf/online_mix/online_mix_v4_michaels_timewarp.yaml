# E5 — time-varying time-warp of the noise+RPS pair. Same sources/stages as
# online_mix_v4_michaels_train_no_room1.yaml, but the second (augment) stage
# also resamples the noise recording at a slowly time-varying playback rate
# alpha(t) = c + a*sin(2*pi*f*t + phi), transforming the RPS label consistently
# as r_tilde(t) = alpha(t) * r(tau(t)), tau(t) = integral_0^t alpha. Applied to
# the noise BEFORE mixing with speech; total |alpha - 1| <= 0.12, slow variation.
# Validation-leakage guard: free-flight_nosource_room1 is excluded because it
# appears in the V4-michaels validation set.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260617

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      min_motor_rps: 30.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      # Michael's FLY125 motor telemetry hovers around 29 RPS; do not apply the
      # DREGON >30 RPS in-flight threshold to it.
      min_motor_rps: 0.0
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward, keep the same mixture distribution and augment 50% of samples;
    # when augmentation is applied, choose exactly one listed augmentation uniformly.
    # Independently, warp 50% of samples' noise+RPS pair with a time-varying rate.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
