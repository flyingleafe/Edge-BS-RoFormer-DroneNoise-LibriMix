# G3 — E12 real full-flight policy + a GP-noise augmentation share (dload-
# portable). Real sources, stages, SNR, augmentation and time-warp are IDENTICAL
# to e12_real_fullflight_dload.yaml (the E12 baseline), so the only difference
# is the added `kind: gp` noise share: the per-drone egonoise GPs
# (campaign 3.4 — physics-anchored comb timbre, coefficients frozen at the
# chunk-mean rps, exact synthetic RPS labels from rps_synthesis). Two GP
# sources (DREGON rig + Matrice-100 rig) at weight 0.5 each vs the real pool's
# 2.0 => ~1/3 of noise chunks are GP-generated (the E4 augmentation share).
#
# GP chunks are cruise-only (synthetic_intermittent; the GP's support is
# rps 40..85) — the real sources still cover the full envelope. Leakage: the GP
# was fitted on CONA-simulated sweeps, never on held-out real recordings.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260724

sources:
  noise:
    # --- real recordings: byte-identical to the E12 baseline policy ---
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0

    # --- GP augmentation share (~1/3 of noise chunks; 0.5+0.5 vs 2.0 real) ---
    - kind: gp
      weight: 0.5
      checkpoint: "r2://ml-data/artifacts/gp_egonoise/dregon/best.pt"
      drone: dregon                  # rig geometry + rps_synthesis profile
      dregon_dir: "dload:DREGON"     # geometry files on cloud boxes
      broadband: true                # sigma_b(rps) colored floor from the ckpt
      rotor_mode: per_rotor          # sum of 1/R combs, exact per-rotor labels
      mic_mode: shell                # project rig mics onto the GP's training shell
      rps:
        kind: synthetic_intermittent
        aggressiveness: 1.0
    - kind: gp
      weight: 0.5
      checkpoint: "r2://ml-data/artifacts/gp_egonoise/matrice100/best.pt"
      drone: michaels
      broadband: true
      rotor_mode: per_rotor
      mic_mode: shell
      rps:
        kind: synthetic_intermittent
        aggressiveness: 1.0

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, and
    # independently time-warp 50% of noise chunks (noise+RPS pair) — matches the
    # E5/E11/E12 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
