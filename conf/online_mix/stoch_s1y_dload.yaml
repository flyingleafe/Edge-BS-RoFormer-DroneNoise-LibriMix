# STOCHASTIC-ONLY stage 1, ARM Y = arm H with a level that means something.
#
# Arm H is the cruise winner and cannot read a slow rotor. This arm narrows the
# per-window random gain, which measurement says is the clearest level-domain
# difference between its stream and a real flight: the same speed-level
# coupling, but roughly twice the scatter around it. See the comment on
# `normalize_rms_range`.
#
sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: stochastic
      weight: 1.0
      n_harmonics: 80
      n_mics: 8
      n_rotors: 4
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps_scale_range: [0.6, 1.3]
      ranges:
        harm_coherence: [0.6, 1.0]
        harm_gp_std_db: [0.5, 3.0]
        floor_rel_db: [-30.0, -8.0]
        min_lines_above_floor: 0.5
      # LEVEL SCATTER, measured. In a real flight one recorder gain covers the
      # whole trajectory, so loudness carries some information about rotor
      # speed. Over two of Michael's recordings the per-second level correlates
      # with mean rev/s at Spearman +0.18 and +0.55 — the coupling itself is
      # variable — with 4.5 to 4.6 dB of scatter around the speed trend.
      #
      # Arm H's stream is NOT missing that coupling: at n=491 it measures +0.25,
      # inside the real range. What it does have is far more scatter, 8.6 dB
      # against real's 4.6, because it redraws a reference level per window over
      # a 21.9 dB range. So level in that stream is a noisier speed cue than in
      # a real flight, not an absent one.
      #
      # Why it plausibly matters below cruise: the level sweep (job
      # levelsweep-54992b) shows cruise is a spacing judgement that ignores
      # level — arm H reads DREGON cruise at 2.05 to 2.16 rev/s across a 4x
      # level change — while EVERY model's zero and ramp cells explode when
      # level is taken away (the target's zero cell goes 2.87 to 61.25). A
      # noisier level cue should therefore cost the low-speed cells and leave
      # cruise alone. That is the prediction this arm tests.
      #
      # ONE CHANGE from arm H: [0.05, 0.15] is a 9.5 dB range, which measured
      # 7.4 dB of scatter against arm H's 8.6 and real's 4.6.
      normalize_rms_range: [0.05, 0.15]
      level_mode: flight
      rps:
        kind: full_flight
        aggressiveness_range: [0.8, 2.5]
        flight_reuse: 32
        phases:
          idle_frac: [0.05, 0.65]
          warmup_s: [0.5, 6.0]
          takeoff_s: [0.4, 2.0]
          landing_s: [0.4, 2.0]
          spinup_s: [0.2, 1.2]
          spindown_s: [0.2, 1.2]
    - kind: silence
      weight: 0.2
      n_channels: 8

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        # One choice per fire, so a block of two at probability 0.5 would give
        # each of them a quarter of the samples. Gain matters here and polarity
        # is an exact no-op for a magnitude front end, so gain takes the block.
        probability: 1.0
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
