# HONEST BASE, STAGE-2 VARIANT, NO SPEECH — `hb_m3s2_dload.yaml` with the
# speech mixture switched off. This is the noise-only half of the SPEECH A/B
# ON REAL DATA: every other ingredient (the real pool, the silence arm, the
# augmentations, the seeds) is byte-identical to the parent, so a difference
# between a row on this policy and its twin on `hb_m3s2_dload.yaml` is the
# mixed-in speech and nothing else.
#
# HOW THE SPEECH IS SWITCHED OFF, and why this way. `policy.source_prob` is the
# probability that a sample gets speech at all
# (`online_mixing._render_rps_sample`). At 0.0 the mixture stays the noise
# chunk itself — the same array, at the same level: no scaling, no
# renormalization, no peak limiting. The `sources.speech` pool STAYS in the
# file on purpose. The fire decision still consumes its `rng.random()` draw,
# thus the per-sample random stream keeps the parent's draw order and the two
# arms see the same noise windows and the same post-mix augmentations.
#
# `snr_ref_floor_rms: 0.02` IS INERT HERE, and stays for the same reason. The
# floor reaches the mixer only as `ref_power_floor` of
# `mixing.mix_at_source_to_noise_snr`, which is called only on the speech path.
# With no speech there is no reference power to floor, thus the key changes
# nothing. Keeping it makes the two policy files differ in ONE line.
#
# WHAT THIS DOES NOT CHANGE: the validation split. Every row on this policy
# still selects on the frozen REAL split with speech
# (`dload:DREGON-LM-V4-michaels-valid-full` through the data config), so the
# arms remain comparable on one number, and the A/B reads as "does training
# speech help the model that must work under speech".
# Batch doc: docs/experiments/paper-regime-matrix.md.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up (as in the parent).
    - until: null
      source_prob: 0.0  # THE ONE DIFFERENCE from hb_m3s2_dload.yaml
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
