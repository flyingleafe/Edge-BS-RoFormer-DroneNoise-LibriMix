# BEAT-VK R2 (2026-07-29): the fs_v2 uniform freq-scale regime
# (e12_fullflight_freqscale_v2_dload.yaml, byte-identical policy/stages) plus
# ONE new real noise source: AVQ-egonoise-vkrps — AVQ rotor ego-noise (mono
# 16 kHz) carrying blind-VK RPS pseudo-labels (scripts/vk_pseudolabel.py,
# published by data_processing.derivations (avq_vkrps spec; annotator scripts/vk_pseudolabel.py); 7 contiguous accepted segments,
# ~617 s, refused/NaN spans dropped at publish time).
#
# Weighting: a real source with an EXPLICIT `weight` becomes its own sub-pool
# in MixedNoisePool instead of joining the duration-weighted real merge
# (build_noise_pool) — without this, AVQ's ~617 s would dwarf DREGON
# (~266 s) + FLY125 by duration. weight 0.5 vs the merged DREGON+michaels
# pool's 2.0 (1.0 per unweighted item) = 0.25 relative to the real pool =
# 20% of noise CHUNKS. NOTE: AVQ is mono, so under flatten_channels each AVQ
# chunk yields 1 training frame vs 8 for the 8-mic reals — its share of
# training FRAMES is ~3%. DREGON+michaels stay dominant on both counts.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    # VK pseudo-labeled AVQ ego-noise: cruise-only (labels 66-117 rev/s),
    # mono; its own weighted sub-pool (see header).
    - kind: frames
      dataset: AVQ-egonoise-vkrps
      min_motor_rps: 0.0
      weight: 0.5
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    # Stage boundary in GENERATED CHUNKS. Under the legacy-equivalent epoch
    # semantics (samples_per_validation 40000 frames = 5000 chunks/epoch at 8
    # mics, batch_size 128 frames = 16 chunks) this is epoch 10 — the boundary
    # the value always intended (see docs/experiments/ckla.md § THE STAGING BUG).
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, freq-scale
    # EVERY noise chunk (fs_v2), and independently time-warp 50% of noise
    # chunks (noise+RPS pair) — matches the E5/E11 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (see fs_v2 policy: with flatten_channels a
          # zeroed channel becomes a silent mono frame carrying nonzero RPS
          # labels — trains prior-regression).
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
