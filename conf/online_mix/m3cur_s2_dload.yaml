# M3CUR — STAGE 2 (cloud/dload twin): REAL fine-tune of the stage-1 predictor.
#
# Sources are the e12 full-flight real recipe verbatim
# (e12_fullflight_freqscale_v2_dload.yaml): DREGON `in_flight_noise` minus
# `free-flight_nosource_room1` and Michael's FLY125, both with
# `min_motor_rps: 0.0` so the WHOLE envelope (ground / warm-up / take-off /
# landing) stays in, plus LibriSpeech train-clean-100 speech.
#
# The ONE difference from the fs_v2 recipe is the policy: its 50k-sample
# unaugmented warm-up stage is REMOVED. This stream fine-tunes a model that is
# already converged on stage 1's synthetic task, so there is nothing to settle
# — a warm-up here would only hand the model 50k samples on which the training
# RPS prior is again a winning strategy, undoing the spacing-reading behaviour
# stage 1 paid for. All three augmentation blocks therefore fire from sample 1,
# at the fs_v2 settings.
#
# Stage 1 is m3cur_s1_dload.yaml; the warm start is the experiment's top-level
# `checkpoint:` (r2://ml-data/artifacts/m3cur_<arch>_s1/checkpoints/best.ckpt).
# Validation stays the fixed FULL-envelope real split
# (conf/data/m3cur_s2.yaml -> dload:DREGON-LM-V4-michaels-valid-full).

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up (see the header): mixtures + all three augmentation
    # blocks from sample 1, at the fs_v2 settings.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (2026-07-27): with flatten_channels each
          # zeroed channel becomes a mono training frame of pure silence
          # carrying nonzero RPS labels — contradicts the silence==zero-RPS
          # convention and trains prior-regression.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
