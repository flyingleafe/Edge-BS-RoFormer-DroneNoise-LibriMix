# REALITY LADDER, RUNG 1 — ONE rig, ONE microphone, no label-transforming
# augmentation. The narrowest real training pool the project can build.
#
# THE LADDER. Four rungs add one real ingredient each, so a gain has one
# cause:
#   R1 (this file)  DREGON only, microphone 0 only
#   R2 real_r2      DREGON only, all 8 microphones      -> what the array buys
#   R3 real_r3      DREGON + Michael's FLY125, 8 mics   -> what a second rig buys
#   R4 hb_m3s2      R3 plus freq_scale and the time warp -> what augmentation buys
# Every rung keeps the honest-base ingredients of R4: the zero-labeled
# `kind: silence` arm, `snr_ref_floor_rms: 0.02`, LibriSpeech at -30 to 0 dB
# SNR and the post-mix gain/polarity block. Validation is the same frozen real
# split at every rung.
#
# WHAT IS REMOVED, and why it is removed here rather than at R4. Both
# `noise_augmentations` (`freq_scale`) and `noise_time_warp` RESAMPLE the noise
# and MULTIPLY the labels, so they manufacture rotor speeds the rig never flew.
# A rung that measures "how much real data is needed" must not be fed
# synthetic label diversity, thus the two blocks are absent from R1 to R3 and
# appear only at R4. The surviving post-mix block is a level offset and a sign
# flip; neither touches a label.
#
# ONE MICROPHONE is `channels: [0]` on the source. The filter is applied to the
# decoded chunk before mixing, so the speech lane count drops to 1 and
# `flatten_channels: true` yields ONE training frame per chunk, not eight.
# The silence arm is `n_channels: 1` for the same reason: at the 8-mic default
# it alone would hold the lane ceiling at 8.
#
# THE SILENCE SHARE IS HELD AT 16.7 %. Unweighted real sources merge into ONE
# stream whose weight is the NUMBER of merged items, so R4's two sources give
# 2.0 against silence 0.4. This rung has one source, thus weight 1.0, and the
# silence arm is halved to 0.2 to keep 0.2 / 1.2 = 16.7 % of chunks.
# Batch doc: docs/experiments/paper-regime-matrix.md.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
      channels: [0]
    - kind: silence
      weight: 0.2
      n_channels: 1
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up: mixtures and the post-mix block from sample 1.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
