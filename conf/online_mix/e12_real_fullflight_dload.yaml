# E12 real-data FULL-FLIGHT policy (dload-portable). Identical to
# online_mix_v4_michaels_timewarp_dload.yaml EXCEPT the DREGON in-flight source
# keeps its whole envelope (min_motor_rps: 0.0 instead of 30.0), so the ~5-13 s
# of pre-takeoff ground/warm-up ramp at the start of every DREGON recording (and
# the landing spindown) become training windows instead of being trimmed away.
# FLY125 is already unfiltered. This is the diagnostic ceiling: if a model
# trained on the REAL full flight still cannot predict the low-RPS regimes, the
# limitation is the data/task, not sim->real transfer. Validated on the FULL
# envelope real split (DREGON-LM-V4-michaels-valid-full, FLY124 — no leakage).

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      cache:
        mode: packed_int16
        dir: "${oc.env:ONLINE_MIX_SOURCE_CACHE_DIR,.cache/online_mix_sources}"

policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    - until: 50000
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, and
    # independently time-warp 50% of noise chunks (noise+RPS pair) — matches the
    # E5/E11 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
