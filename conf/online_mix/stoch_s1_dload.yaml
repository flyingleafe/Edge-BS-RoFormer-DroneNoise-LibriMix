# STOCHASTIC-ONLY stage 1 — synthetic-only training whose target is transfer to
# the real frozen validation split, with NO real noise anywhere in the stream.
#
# The noise source is `kind: stochastic`
# (data_processing/stochastic_rotor_noise.py): a smooth colored floor plus one
# Lorentzian line per harmonic of every rotor, with every amplitude drifting
# slowly in time as a Gaussian process. It is the generative direction of the v4
# analysis model, and it is the widest synthetic family the project has: each
# window draws its own timbre, floor color, linewidths and wander rates, so no
# two windows share a texture.
#
# WHAT THIS ARM TESTS. Every earlier synthetic-only predictor transferred badly
# to the real split: the analytic static comb reaches 213-337 validation PIT-MSE
# depending on the trunk (m3abl_comb_*_s1), the neural generator 227-373
# (m3cur_*_s1, e7_gencurric_*), against 17.6 for the best real-trained model.
# The diagnosis in both cases was a family too narrow to contain the real thing.
# This arm holds everything else fixed and widens the family.
#
# THE SOURCES.
#  * `stochastic`, weight 1.0, full-flight excitation, so the stream spans
#    ground, warm-up, take-off, cruise and landing, and a stopped rotor is
#    exactly silent (amp_rps_exponent 2.5).
#  * `silence`, weight 0.2. The stochastic pool goes to true digital silence at
#    zero speed, and a real recording never does — a stopped-rotor span still
#    carries room tone, and one validation clip peaks at 41-50 Hz with every
#    rotor off. Without this arm the model would learn that zero speed means an
#    empty signal, which is the exact failure the R2 regime was built to remove.
#    The weight is lower than R2's 0.4 because the full-flight excitation
#    already supplies its own share of near-zero windows.
#  * `snr_ref_floor_rms: 0.02`, as in R2, so a quiet noise chunk does not drag
#    the whole sample down through the speech scaling.
#
# Everything else is m3abl_comb_s1_dload.yaml verbatim: same rate, duration and
# base seed, same speech source, and the same single stage with all three
# augmentation blocks firing from sample 1. The two policies therefore differ in
# their synthetic ingredient and in nothing else.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: stochastic
      weight: 1.0
      n_harmonics: 80
      n_mics: 8
      n_rotors: 4
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_reuse: 32
    - kind: silence
      weight: 0.2
      n_channels: 8

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    # ONE stage, no warm-up: mixtures plus all three augmentation blocks from
    # sample 1, identical to the comb-only stage 1 this arm is compared with.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
