# F2 step 2 — the survey protocol of `se_avq_survey.yaml` with the training
# noise pool widened from AVQ-only to ALL drone noise sources.
#
# Single-variable design: every other knob is byte-identical to
# `conf/online_mix/se_avq_survey.yaml` (16 kHz, 3.0 s crops, SNR ~ U(-25,-5) dB,
# no augmentation, same LibriSpeech speech block with the same 25 held-out
# speakers, same base_seed). ONLY `sources.noise` changes. Validation stays on
# the fixed `SE-valid-avq-survey` set (see conf/data/f2_alldrone.yaml).
#
# The noise list is the drone pool of `conf/online_mix/se_drone_only.yaml`
# (F1 Pass A), copied verbatim, PLUS the 5 AVQ ego-noise sequences that step 1
# trains on. AVQ is not part of se_drone_only.yaml, but including it here makes
# this pool a strict SUPERSET of the step-1 pool, which is the cleaner
# experimental design: the only thing added between step 1 and step 2 is extra
# drone noise, so any change in the (identical) AVQ validation score is
# attributable to added noise diversity rather than to also having removed the
# in-domain source.
#
# See docs/experiments/f2-survey-replication.md.

task: speech_enhancement
sample_rate: 16000
duration_s: 3.0
base_seed: 20260725

sources:
  noise:
    # --- step-1 in-domain source, kept so this pool is a superset ---
    # `AVQ-egonoise` = exactly the 5 pure ego-noise sequences of AVQ, channel 0,
    # 16 kHz mono (~705 s, one 43 MiB shard) — so no `include_keys`/`channel`
    # filtering is needed. It exists because key filtering over `AVQ` had to open
    # all 11 shards (~4 GiB) to locate those 5 recordings, and one AVQ shard is a
    # 352 MB multipart object rejected by s3transfer's ETag check on some boto3
    # builds (Kaggle). Publisher: scripts/publish_avq_egonoise.py.
    - kind: audio_pool
      dataset: AVQ-egonoise
      weight: 1.0
    # --- the F1 Pass A drone pool, verbatim ---
    # Real target-domain drones (valid holds out room1 + FLY124).
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids: [free-flight_nosource_room1]
      min_motor_rps: 30.0
      weight: 1.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
      weight: 1.0
    # Open drone-noise datasets (train side of the per-shard/recording holdout;
    # valid_shards: 2 kept complementary to scripts/build_se_valid.py).
    - kind: audio_pool
      dataset: drone_audio
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: DroneAudioSet
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: SPCUP19-egonoise
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
    - kind: audio_pool
      dataset: new-drone-noises
      holdout: {split: train, valid_shards: 2}
      max_shards: 24
      weight: 1.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      # Held-out valid speakers (every 10th id, sorted) — identical list to
      # conf/online_mix/se_avq_survey.yaml and scripts/build_se_valid.py's
      # HELDOUT_SPEAKERS, so train/valid speech never overlap.
      exclude:
        [19, 89, 211, 307, 445, 831, 1098, 1502, 1898, 2182, 2764, 3168, 3526,
         3982, 4267, 4813, 5322, 5703, 6081, 6476, 7067, 7312, 7800, 8238, 8630]
      # No packed cache: this stream is mono (one utterance per sample, vs the
      # 8-channel RPS streams' eight), so direct FLAC decode keeps up.
      cache:
        mode: none

policy:
  source_prob: 1.0
  snr_db:
    uniform: {low: -25.0, high: -5.0}
  speech_per_channel: independent
  snr_per_channel: false
  # No augmentations — the paper mentions none (and step 1 has none).
