# E11 (cloud/dload twin) — FULL-FLIGHT combined noise task WITH augmentation.
# 50% neural generator (retrained on the full RPS range, e11_noisegen_silence)
# gen = e11_noisegen_silence (emitter silence-fade: zero RPS => true silence)
# + 50% analytic static-comb, BOTH full-flight RPS (ground->warm-up->takeoff->
# cruise->landing->ground), mixed with LibriSpeech at -30..0 dB, WITH augmentation
# from the start (regularizer that reduces the sim->real texture gap E10 exposed).
# Validation = fixed FULL-envelope real split (dload:DREGON-LM-V4-michaels-valid-full).

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    # --- 50%: neural generator (full RPS range), full-flight excitation ---
    - kind: generated
      weight: 1.0
      checkpoint: r2://ml-data/artifacts/e11_noisegen_silence/checkpoints/best.ckpt
      n_harmonics: 100
      device: cuda:0
      dregon_dir: "dload:DREGON"
      gen_batch: 32
      random_phase: true
      refresh: true
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_fs: 200.0
      interp:
        endpoints: [dregon, michaels]
        alpha: {low: 0.0, high: 1.0}
        embedding_noise: 0.15
        rotor_interp: true
        jitter_sigma: interp
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02
      buffer: {slots: 512, warmup: 32}

    # --- 50%: analytic static-comb, full-flight excitation (zero -> silence) ---
    - kind: static_comb
      weight: 1.0
      n_harmonics: 100
      n_mics: 8
      n_rotors: 4
      min_harm_above_floor: 0.30
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_reuse: 32

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  # Single stage WITH augmentation from the start (regularizes against overfitting
  # to synthetic texture — the domain-gap reducer removed in E10; when applied,
  # one listed augmentation is chosen uniformly).
  source_prob: 1.0
  snr_db:
    uniform: {low: -30.0, high: 0.0}
  speech_per_channel: independent
  snr_per_channel: false
  augmentations:
    probability: 0.5
    choices:
      - random_gain: {min_db: -6.0, max_db: 6.0}
      - random_polarity: {}
      - channel_drop: {max_channels: 1}
