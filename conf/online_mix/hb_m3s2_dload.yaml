# HONEST BASE, STAGE-2 VARIANT: the R2 honest-base regime with the warm-up
# stage removed. This is the real fine-tune stream for the regime-matched
# curriculum reruns (R3 = gen+comb curriculum, R4 = comb-only curriculum).
#
# RELATION TO THE TWO PARENTS.
# (1) Sources = hb_silence_dload.yaml verbatim: the fs_v2 real pool (DREGON
# `in_flight_noise` minus `free-flight_nosource_room1` and Michael's FLY125,
# both at `min_motor_rps: 0.0`, so the WHOLE envelope stays in), plus the
# zero-labeled `kind: silence` arm at weight 0.4 against the merged real weight
# 2.0 (16.7% of noise chunks), plus LibriSpeech train-clean-100 speech.
# The SNR reference floor (`snr_ref_floor_rms: 0.02`) comes with it: the mixer
# scales the speech onto the noise power, thus a near-silent noise chunk drags
# the whole sample down and every zero-RPS sample becomes globally quiet. The
# floor keeps the sample level usable while the noise stays quiet.
# (2) Policy = m3cur_s2_dload.yaml verbatim: ONE stage, no warm-up.
#
# WHY NO WARM-UP (the m3cur stage-2 argument, unchanged). This stream
# fine-tunes a model that is already converged on stage 1's synthetic task, so
# there is nothing to settle. A warm-up here would only hand the model 50k
# samples on which the training RPS prior is again a winning strategy, and undo
# the spacing-reading behaviour that stage 1 paid for. All three augmentation
# blocks therefore fire from sample 1, at the fs_v2 settings.
#
# USED BY: r3hb_{scv2,tr,gru} (warm start from the m3cur stage-1 checkpoints)
# and r4hb_{scv2,tr,gru} (warm start from the m3abl_comb stage-1 checkpoints).
# The warm start is the experiment's top-level `checkpoint:`. Validation stays
# the fixed FULL-envelope real split `dload:DREGON-LM-V4-michaels-valid-full`.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
    - kind: silence
      weight: 0.4
      n_channels: 8
  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up (see the header): mixtures + all three augmentation
    # blocks from sample 1, at the fs_v2 settings.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED (2026-07-27): with flatten_channels each
          # zeroed channel becomes a mono training frame of pure silence
          # carrying nonzero RPS labels — contradicts the silence==zero-RPS
          # convention and trains prior-regression.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
