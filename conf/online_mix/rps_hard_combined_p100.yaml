# E9 (kaggle/P100 twin) — "hard" combined generated-noise task; neural-gen
# checkpoint + DREGON geometry + speech all streamed from R2. See
# rps_hard_combined.yaml for the full description. Noise pool =
# 50% neural generator (E7 vicinal-interp PositionalHarmonicNoiseGen) + 50%
# analytic static-comb (E8), so the predictor must cope with BOTH the neural
# generator's rich/variable amplitude behaviour AND the amplitude-free static
# comb — it cannot lean on either source's idiosyncratic shortcut. Random
# LibriSpeech mixtures at -30..0 dB, plus mixture-level augmentations applied to
# 50% of samples from the very start. Validation stays fixed/real
# (conf/data/rps_hard_combined.yaml). Cloud twin: rps_hard_combined_dload.yaml.

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    # --- 50%: full neural generator (vicinal interp along DREGON<->Michael's) ---
    - kind: generated
      weight: 1.0
      checkpoint: r2://ml-data/artifacts/e6_noisegen_jitter_latreg_perdrone/checkpoints/best.ckpt
      n_harmonics: 100
      device: cuda:0
      dregon_dir: "dload:DREGON"
      gen_batch: 16  # reduced from 32 for P100 16GB (kaggle) to avoid noise-gen OOM
      random_phase: true
      refresh: true
      rps:
        kind: synthetic_intermittent
        aggressiveness: 1.0
      interp:
        endpoints: [dregon, michaels]
        alpha: {low: 0.0, high: 1.0}
        embedding_noise: 0.15
        rotor_interp: true
        jitter_sigma: interp
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02
      buffer: {slots: 512, warmup: 32}

    # --- 50%: analytic static-comb (forces harmonic-frequency tracking) ---
    - kind: static_comb
      weight: 1.0
      n_harmonics: 100
      n_mics: 8
      n_rotors: 4
      min_harm_above_floor: 0.30
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      rps:
        kind: synthetic_intermittent
        aggressiveness: 1.0

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # Single stage from the start: random speech/noise mixtures + 50% augmentation.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
