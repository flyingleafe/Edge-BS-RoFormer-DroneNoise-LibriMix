# M3CUR — STAGE 1 (cloud/dload twin): RPS-predictor pre-training on SYNTHETIC
# noise only (no real recording in the pool), full-flight excitation.
#
# Noise pool = 50% neural generator + 50% analytic static-comb, exactly the E10
# split, but on the M3 generator (`gen_m3_refined_all_perrotor`, ep30) — the
# refined-label per-rotor model, whose emitter code is per-rotor
# (`z_r = z_drone + delta_z_r`). Both sources are driven by FULL-FLIGHT RPS
# trajectories (ground -> warm-up -> takeoff -> cruise -> landing -> ground), so
# the stream spans the zero-RPS regime and the generator is driven into silence
# at the stopped ends.
#
# Two vicinal knobs are new here, both on the interp segment and both aimed at
# the SAME failure mode (a predictor that memorises the two real rigs):
#   * perrotor_noise: 0.5 — each producer batch redraws the per-rotor code
#     deltas as delta_z_r + N(0, 0.5 x RMS_r||delta_z_r||), so the four rotors
#     of a generated drone are not the four rotors the generator was fitted to;
#   * rotor_jitter_std: 0.2 — each batch jitters the interpolated rotor
#     POSITIONS by N(0, 0.2 m) per rotor per coordinate, so the airframe scale
#     and rotor layout vary too (mic_sampling.jitter_std stays 0.02 m — the mic
#     rig is a measured object, the generated airframe is not).
#
# DELIBERATE OVERRIDE of the warm-up convention: there is exactly ONE stage and
# every augmentation block fires from sample 1. The unaugmented warm-up stage
# (G5) exists to let a model settle on the REAL data distribution before the
# distribution is widened; here stage 1 is entirely synthetic, is not the
# distribution we ultimately want fitted, and its whole job is to hand stage 2 a
# model that already reads comb SPACING rather than amplitude/timbre. A warm-up
# on unaugmented generated noise would train exactly the anchor stage 2 has to
# undo, so it is removed on purpose.
#
# Stage 2 (real fine-tune) is m3cur_s2_dload.yaml; validation stays fixed/real
# (conf/data/m3cur_s1.yaml -> dload:DREGON-LM-V4-michaels-valid-full).

sample_rate: 16000
duration_s: 1.0
base_seed: 20260712

sources:
  noise:
    # --- 50%: the M3 per-rotor neural generator, full-flight excitation ---
    - kind: generated
      weight: 1.0
      checkpoint: r2://ml-data/artifacts/gen_m3_refined_all_perrotor/checkpoints/ep30_mrstft_6.7391.ckpt
      n_harmonics: 100                # MUST match the checkpoint's training value
      device: cuda:0                  # the ONE extra CUDA context (producer)
      dregon_dir: "dload:DREGON"      # geometry on a machine with no data/ tree
      gen_batch: 32
      random_phase: true
      refresh: true                   # live stream (never validate on it)
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_fs: 200.0
      interp:
        endpoints: [dregon, michaels] # codebook names defining the segment
        alpha: {low: 0.0, high: 1.0}  # uniform alpha along the segment (per batch)
        embedding_noise: 0.15         # Gaussian std around z(alpha), in units of ||z1-z0||
        rotor_interp: true            # interpolate rotor positions at alpha
        jitter_sigma: interp          # blend the learned per-drone OU sigma at alpha
        perrotor_noise: 0.5           # redraw the per-rotor code deltas each batch
        rotor_jitter_std: 0.2         # meters, per rotor per coordinate, each batch
        mic_sampling:
          rigs: [dregon, michaels]
          prob: [0.5, 0.5]
          jitter_std: 0.02            # per-mic 3D Gaussian std (meters)
      buffer: {slots: 512, warmup: 32}

    # --- 50%: analytic static-comb, full-flight excitation (zero -> silence) ---
    - kind: static_comb
      weight: 1.0
      n_harmonics: 100
      n_mics: 8
      n_rotors: 4
      min_harm_above_floor: 0.30
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps:
        kind: full_flight
        aggressiveness: 1.0
        flight_reuse: 32

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100
policy:
  stages:
    # ONE stage, no warm-up: mixtures + all three augmentation blocks from
    # sample 1 (see the header for why the G5 warm-up is deliberately absent).
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          # channel_drop REMOVED: with flatten_channels each zeroed channel
          # becomes a mono frame of pure silence carrying nonzero RPS labels,
          # contradicting the silence==zero-RPS convention.
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
