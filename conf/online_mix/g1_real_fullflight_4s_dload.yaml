# G1 (VK-parity) real-data FULL-FLIGHT policy, 4 s training chunks.
# Identical to e12_real_fullflight_dload.yaml EXCEPT duration_s: 4.0 (was 1.0).
# Motivation: the phase-A test-time-smoothing eval (scripts/rps_predictor_vk_eval.py)
# showed E12 models trained on 1 s chunks plateau ~2.7-3 rev/s pooled MAE on the
# DREGON cruise clips vs the blind-VK ~0.68-0.74 bar; temporal context is the
# obvious missing ingredient a longer training chunk provides natively.
# See docs/experiments/g1-vk-parity.md.

sample_rate: 16000
duration_s: 4.0
base_seed: 20260712

sources:
  noise:
    - kind: frames
      dataset: DREGON-frames
      splits: [in_flight_noise]
      exclude_recording_ids:
        - free-flight_nosource_room1
      # WHOLE envelope: keep the ground/warm-up/take-off ramp (and landing).
      min_motor_rps: 0.0
    - kind: frames
      dataset: michaels-frames
      recording_ids: [FLY125]
      min_motor_rps: 0.0
  speech:
    - kind: audio_files
      root: "dload:librispeech/LibriSpeech/train-clean-100"
      glob: "**/*.flac"
      cache:
        mode: packed_int16
        dir: "${oc.env:ONLINE_MIX_SOURCE_CACHE_DIR,.cache/online_mix_sources}"

policy:
  stages:
    # First 50k samples = 10 validation intervals at samples_per_validation=5000:
    # random speech/noise mixtures, no augmentation.
    # ⚠️ STAGE BOUNDARY IS IN GENERATED CHUNKS, NOT TRAINING FRAMES.
    # With flatten_channels=true on the 8-mic E12 sources each chunk yields
    # 8 mono frames, so the boundary in FRAMES is 8x this value. 6250 chunks
    # = 50k frames = 10 epochs at samples_per_validation 5000 — the boundary
    # the '50000' value was always believed to be. (The old value put stage 2
    # at epoch ~80; no run ever reached it — docs/experiments/ckla.md
    # § THE STAGING BUG.)
    - until: 6250
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false

    # Afterward: same mixture distribution; augment 50% of samples, and
    # independently time-warp 50% of noise chunks (noise+RPS pair) — matches the
    # E5/E11 time-warp recipe exactly.
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        probability: 0.5
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
          - random_polarity: {}
          - channel_drop: {max_channels: 1}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
