# STOCHASTIC-ONLY stage 1, ARM Z = arm H with the level gain FIXED.
#
# The far end of arm Y. Arm H redraws a reference level per window over 21.9 dB;
# arm Y narrows that to 9.5 dB; this arm removes it, leaving `level_mode:
# flight`'s speed law as the only thing that sets loudness.
#
sample_rate: 16000
duration_s: 1.0
base_seed: 20260712
snr_ref_floor_rms: 0.02

sources:
  noise:
    - kind: stochastic
      weight: 1.0
      n_harmonics: 80
      n_mics: 8
      n_rotors: 4
      drone_profile_range: [0.0, 1.0]
      mic_gain_db: [-12.0, 0.0]
      amp_rps_exponent: 2.5
      amp_rps_ref: 80.0
      rps_scale_range: [0.6, 1.3]
      ranges:
        harm_coherence: [0.6, 1.0]
        harm_gp_std_db: [0.5, 3.0]
        floor_rel_db: [-30.0, -8.0]
        min_lines_above_floor: 0.5
      # THE ENDPOINT OF ARM Y. A fixed reference level, so the level-to-speed
      # law is the SAME across every training window. Arm Y narrows the random
      # gain to a 9.5 dB range; this removes it.
      #
      # Why a single-window model needs that. Training windows are 1 s and
      # independent, so a model can only use loudness if the mapping from level
      # to speed is consistent across the whole TRAINING SET — a per-recording
      # gain does not help it, because it cannot see which recording a window
      # came from. The frozen split's Michael's half is one recording at one
      # gain, where level predicts speed at Spearman +0.73 with 3.2 dB of
      # scatter; arm H's stream offers +0.25 with 8.6 dB. With the gain fixed,
      # only `level_mode: flight`'s speed law moves the level, so the stream
      # carries a clean level cue for the first time.
      #
      # The risk is the mirror of the reward: a model that leans on absolute
      # level could break when the real level sits elsewhere. The level sweep
      # (job levelsweep-54992b) bounds it — cruise ignores level entirely — and
      # arm Y brackets this arm from the other side.
      normalize_rms: 0.09
      level_mode: flight
      rps:
        kind: full_flight
        aggressiveness_range: [0.8, 2.5]
        flight_reuse: 32
        phases:
          idle_frac: [0.05, 0.65]
          warmup_s: [0.5, 6.0]
          takeoff_s: [0.4, 2.0]
          landing_s: [0.4, 2.0]
          spinup_s: [0.2, 1.2]
          spindown_s: [0.2, 1.2]
    - kind: silence
      weight: 0.2
      n_channels: 8

  speech:
    - dataset: librispeech
      subpath: LibriSpeech/train-clean-100

policy:
  stages:
    - until: null
      source_prob: 1.0
      snr_db:
        uniform: {low: -30.0, high: 0.0}
      speech_per_channel: independent
      snr_per_channel: false
      augmentations:
        # One choice per fire, so a block of two at probability 0.5 would give
        # each of them a quarter of the samples. Gain matters here and polarity
        # is an exact no-op for a magnitude front end, so gain takes the block.
        probability: 1.0
        choices:
          - random_gain: {min_db: -6.0, max_db: 6.0}
      noise_augmentations:
        probability: 1.0
        choices:
          - freq_scale: {alpha_low: 0.7, alpha_high: 1.3}
      noise_time_warp:
        probability: 0.5
        dev_const: 0.08
        dev_sine: 0.04
        f_low: 0.1
        f_high: 1.0
